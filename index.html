<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>中国地下摇滚声音地图 · 1050+全量乐队与文化年鉴</title>
  <style>
    :root {
      --paper: #ebe3d2;
      --paper-dark: #dfd5be;
      --ink: #141413;
      --crimson: #c92a2a;
      --amber: #d97706;
      --teal: #0f766e;
      --green: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", monospace, sans-serif;
      user-select: none;
    }
    /* 复古复印纸网点纹理 */
    .halftone-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.14;
      background-image: radial-gradient(var(--ink) 0.85px, transparent 0.85px);
      background-size: 9px 9px;
    }
    /* 顶部总控台 */
    #top-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--paper); border-bottom: 3px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      padding: 6px 10px;
    }
    .header-row-1 {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px;
    }
    .brand-box { display: flex; align-items: center; gap: 6px; }
    .brand-stamp {
      background: var(--crimson); color: #fff; font-weight: 900; font-size: 11px;
      padding: 2px 6px; border: 2px solid var(--ink); transform: rotate(-2deg);
    }
    .brand-title { font-size: 16px; font-weight: 900; letter-spacing: -0.5px; }
    .search-bar-wrap {
      position: relative; flex: 1; min-width: 200px; max-width: 480px; display: flex; gap: 4px;
    }
    #search-input {
      flex: 1; height: 32px; padding: 0 8px; font-size: 12px; font-weight: 700;
      background: #fff; border: 2px solid var(--ink); color: var(--ink); outline: none;
    }
    #search-input:focus { background: #fff9db; }
    .zine-btn {
      height: 32px; padding: 0 8px; font-size: 11px; font-weight: 900;
      border: 2px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer; display: inline-flex;
      align-items: center; gap: 3px; white-space: nowrap; transition: transform 0.08s;
    }
    .zine-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .zine-btn.red { background: var(--crimson); color: #fff; }
    .zine-btn.dark { background: var(--ink); color: var(--paper); }
    .zine-btn.amber { background: #fef08a; color: var(--ink); }
    .zine-btn.teal { background: #ccfbf1; color: var(--ink); }
    .header-row-2 {
      display: flex; align-items: center; gap: 5px; overflow-x: auto;
      padding-top: 5px; margin-top: 5px; border-top: 1px dashed rgba(20,20,19,0.3);
      scrollbar-width: none;
    }
    .header-row-2::-webkit-scrollbar { display: none; }
    .sm-btn {
      height: 25px; padding: 0 7px; font-size: 11px; font-weight: 800;
      border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 1.5px 1.5px 0 var(--ink); cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .sm-btn.active { background: var(--crimson); color: #fff; }
    /* 搜索结果最高层级下拉框 */
    #search-dropdown {
      position: fixed; z-index: 99999; display: none;
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink); max-height: 62vh; overflow-y: auto;
      width: min(94vw, 460px);
    }
    .search-item {
      padding: 8px 10px; border-bottom: 1.5px dashed rgba(20,20,19,0.25);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.75);
    }
    .search-item:hover { background: #fef08a; }
    /* 地图主画布 */
    #map-viewport {
      position: fixed; inset: 0; top: 76px; overflow: hidden;
      cursor: grab; touch-action: none; z-index: 5;
      background: radial-gradient(circle at center, #efe8d8 0%, #dfd5be 100%);
    }
    #map-viewport.grabbing { cursor: grabbing; }
    #map-stage {
      width: 100%; height: 100%; transform-origin: 0 0; will-change: transform;
    }
    .prov-path {
      fill: #e3dac3; stroke: #2b2927; stroke-width: 0.75px;
      vector-effect: non-scaling-stroke; transition: fill 0.15s;
    }
    .prov-path:hover { fill: #d4c6a6; }
    .city-node { cursor: pointer; }
    .city-node:hover .city-ring { stroke-width: 2.5px; stroke: #fef08a; }
    .landmark-node { cursor: pointer; }
    /* 缩放与图例控件 */
    #map-controls {
      position: fixed; left: 10px; bottom: 14px; z-index: 500;
      display: flex; flex-direction: column; gap: 5px;
    }
    .ctrl-btn {
      width: 34px; height: 34px; font-size: 16px; font-weight: 900;
      background: var(--paper); border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
    }
    /* 右下角统计铭牌 */
    #stats-badge {
      position: fixed; right: 10px; bottom: 14px; z-index: 400;
      background: var(--paper); border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); padding: 5px 9px; font-size: 11px;
      pointer-events: none;
    }
    /* 足迹连线/路线激活顶部浮条 */
    #trace-banner {
      position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
      z-index: 800; display: none; background: var(--ink); color: #fef08a;
      border: 2px solid #fef08a; box-shadow: 4px 4px 0 var(--crimson);
      padding: 6px 12px; font-size: 12px; font-weight: 800;
      align-items: center; gap: 10px; max-width: 94vw;
    }
    /* 城市抽屉面板 */
    #city-drawer {
      position: fixed; top: 76px; right: 0; bottom: 0;
      width: min(100vw, 520px); background: var(--paper);
      border-left: 4px solid var(--ink); box-shadow: -6px 0 0 rgba(20,20,19,0.9);
      z-index: 1200; transform: translateX(105%);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
    }
    #city-drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 10px 12px; background: var(--paper-dark);
      border-bottom: 3px solid var(--ink);
    }
    .drawer-filter-bar {
      padding: 6px 12px; background: #e5dcc6; border-bottom: 2px solid var(--ink);
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    #drawer-list {
      flex: 1; overflow-y: auto; padding: 10px 12px 60px;
      -webkit-overflow-scrolling: touch;
    }
    /* 乐队文献卡片 */
    .band-card {
      background: rgba(255,255,255,0.88); border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); padding: 10px; margin-bottom: 10px;
      transition: background-color 0.2s;
    }
    .band-card.flash {
      animation: cardFlash 0.65s ease-in-out 4;
    }
    @keyframes cardFlash {
      0%, 100% { background: rgba(255,255,255,0.9); border-color: var(--ink); }
      50% { background: #fef08a; border-color: var(--crimson); transform: scale(1.01); }
    }
    .badge {
      display: inline-block; padding: 1px 5px; font-size: 10px; font-weight: 800;
      border: 1px solid var(--ink); margin-right: 4px;
    }
    .badge.punk { background: var(--crimson); color: #fff; }
    .badge.metal { background: var(--ink); color: #fef08a; }
    .badge.indie { background: #0f766e; color: #fff; }
    .badge.folk { background: #b45309; color: #fff; }
    .stream-links {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px;
      padding-top: 6px; border-top: 1px dashed rgba(20,20,19,0.25);
    }
    .stream-a {
      font-size: 10px; font-weight: 800; padding: 2px 6px;
      border: 1px solid var(--ink); text-decoration: none; color: var(--ink);
      background: #fff;
    }
    .stream-a.wy { background: #fee2e2; color: #991b1b; }
    .stream-a.qq { background: #dcfce7; color: #166534; }
    .stream-a.bl { background: #e0f2fe; color: #075985; }
    .stream-a.yt { background: #f3f4f6; color: #1f2937; }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .act-btn {
      font-size: 10px; font-weight: 800; padding: 2px 6px;
      border: 1px solid var(--ink); background: var(--paper); cursor: pointer;
    }
    .act-btn:hover { background: #fef08a; }
    /* 通用弹窗遮罩 */
    .modal-mask {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(15,15,15,0.72); display: none;
      align-items: center; justify-content: center; padding: 12px;
    }
    .modal-box {
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink); width: 100%; max-width: 560px;
      max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      padding: 10px 12px; background: var(--ink); color: var(--paper);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-size: 14px;
    }
    .modal-body {
      padding: 12px; overflow-y: auto; flex: 1; font-size: 12px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 6px 8px; font-size: 12px; font-weight: 700;
      border: 2px solid var(--ink); background: #fff; margin-top: 3px; margin-bottom: 8px;
    }
    /* 吐司通知 */
    #toast-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 99999; background: var(--ink); color: #fef08a;
      border: 2px solid #fff; box-shadow: 4px 4px 0 var(--crimson);
      padding: 7px 14px; font-size: 12px; font-weight: 900; display: none;
    }
    @media (max-width: 640px) {
      .brand-title { font-size: 14px; }
      #map-viewport { top: 82px; }
      #city-drawer { top: auto; height: 82vh; width: 100vw; border-left: none; border-top: 4px solid var(--ink); transform: translateY(105%); }
      #city-drawer.open { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="halftone-bg"></div>

  <!-- 顶部主控台 -->
  <header id="top-header">
    <div class="header-row-1">
      <div class="brand-box">
        <span class="brand-stamp">ZINE 2026</span>
        <h1 class="brand-title">中国摇滚声音地图</h1>
        <span id="top-count-tag" style="font-size:10px;font-weight:900;background:#141413;color:#fef08a;padding:1px 5px;">1050+ 乐队</span>
      </div>

      <div class="search-bar-wrap" id="search-wrap">
        <input id="search-input" type="text" placeholder="搜乐队 / 城市 / 代表作 (如: Lur / 万青 / 草东 / 生命之饼)..." autocomplete="off" />
        <button class="zine-btn dark" id="btn-do-search">搜索</button>
        <button class="zine-btn amber" id="btn-random-band" title="随机漫游一支乐队">🎲 随机发现</button>
        <button class="zine-btn red" id="btn-open-add">＋ 补录乐队</button>
      </div>
    </div>

    <!-- 第二排：11大摇滚基建功能栏 -->
    <div class="header-row-2">
      <button class="sm-btn" id="btn-daily-rec">📅 今日声波推荐</button>
      <button class="sm-btn" id="btn-toggle-landmarks">🏛️ 场景地标图层 (开)</button>
      <button class="sm-btn" id="btn-open-routes">🚩 朝圣打卡路线</button>
      <button class="sm-btn" id="btn-open-rank">📊 城市榜 & 冷门特集</button>
      <button class="sm-btn" id="btn-open-favs">⭐ 收藏/想去现场 (<span id="fav-num">0</span>)</button>
      <button class="sm-btn" id="btn-open-mod">🛡️ 审核队列 & 认领 (<span id="mod-num">0</span>)</button>
      <button class="sm-btn" id="btn-open-profile">🏅 贡献者徽章 (<span id="pts-num">100</span>分)</button>
    </div>
  </header>

  <!-- 搜索候选框（绝对置顶 z-index:99999） -->
  <div id="search-dropdown"></div>

  <!-- 轨迹/路线激活顶部提示条 -->
  <div id="trace-banner">
    <span id="trace-banner-text">当前轨迹模式</span>
    <button class="sm-btn active" onclick="clearMapTraces()">✕ 退出轨迹</button>
  </div>

  <!-- 矢量地图视口（内置全境轮廓，0秒直出） -->
  <main id="map-viewport">
    <svg id="map-stage" viewBox="0 0 1000 780" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid-pat" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141413" stroke-width="0.35" stroke-opacity="0.18" />
        </pattern>
      </defs>
      <rect width="1600" height="1200" x="-300" y="-200" fill="url(#grid-pat)" />
      <!-- 省份轮廓层 -->
      <g id="layer-provinces"></g>
      <!-- 南海九段线与附图框 -->
      <g id="layer-nine-dash" transform="translate(765, 555)">
        <rect x="0" y="0" width="115" height="145" fill="#e6dec8" stroke="#141413" stroke-width="1.5" />
        <text x="6" y="14" font-size="8" font-weight="900" fill="#141413">南海诸岛 (中国版图)</text>
        <path d="M25,35 L32,48 M85,30 L82,48 M92,68 L88,86 M80,108 L70,124 M45,132 L32,126 M18,95 L22,76" stroke="#c92a2a" stroke-width="1.8" stroke-dasharray="3,2" fill="none" />
        <circle cx="48" cy="58" r="2.2" fill="#141413" />
        <circle cx="66" cy="88" r="2.2" fill="#141413" />
        <circle cx="52" cy="115" r="2" fill="#141413" />
      </g>
      <!-- 朝圣路线与乐队足迹连线层 -->
      <g id="layer-traces"></g>
      <!-- 历史场景地标层（树村/迷笛/Livehouse/打口店） -->
      <g id="layer-landmarks"></g>
      <!-- 城市摇滚火漆印章层 -->
      <g id="layer-cities"></g>
    </svg>
  </main>

  <!-- 左下缩放控制 -->
  <div id="map-controls">
    <button class="ctrl-btn" onclick="zoomMapBy(1.3)" title="放大">＋</button>
    <button class="ctrl-btn" onclick="zoomMapBy(0.76)" title="缩小">－</button>
    <button class="ctrl-btn" onclick="resetMapView()" title="复位全国" style="font-size:11px;">全国</button>
  </div>

  <!-- 右下统计铭牌 -->
  <div id="stats-badge">
    <div>收录城市：<strong id="stat-city-cnt">78</strong> 座 | 乐队总数：<strong id="stat-band-cnt" style="color:var(--crimson);">1050+</strong> 支</div>
    <div style="font-size:10px;opacity:0.75;">含中国台湾、港澳、南海诸岛完整版图 · 虚拟渲染零卡顿</div>
  </div>

  <!-- 右侧/底部：城市乐队文献抽屉 -->
  <aside id="city-drawer">
    <div class="drawer-head">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <span id="drw-prov" class="brand-stamp" style="display:inline-block;margin-bottom:3px;">省份</span>
          <h2 id="drw-city" style="font-size:20px;font-weight:900;">城市名称</h2>
        </div>
        <div style="display:flex;gap:5px;">
          <button class="zine-btn red" id="btn-drw-add" style="height:28px;font-size:11px;">＋ 在此城加乐队</button>
          <button class="zine-btn dark" onclick="closeCityDrawer()" style="height:28px;">✕ 关闭</button>
        </div>
      </div>
      <p id="drw-desc" style="font-size:11px;margin-top:4px;line-height:1.4;opacity:0.88;"></p>
    </div>

    <div class="drawer-filter-bar">
      <span style="font-size:11px;font-weight:900;">共 <strong id="drw-count" style="color:var(--crimson);">0</strong> 支：</span>
      <button class="sm-btn active" data-gf="ALL" onclick="filterDrawerGenre('ALL')">全部</button>
      <button class="sm-btn" data-gf="朋克" onclick="filterDrawerGenre('朋克')">朋克/硬核</button>
      <button class="sm-btn" data-gf="金属" onclick="filterDrawerGenre('金属')">重金属/核</button>
      <button class="sm-btn" data-gf="后摇" onclick="filterDrawerGenre('后摇')">后摇/数学</button>
      <button class="sm-btn" data-gf="独立" onclick="filterDrawerGenre('独立')">独立/后朋</button>
      <button class="sm-btn" data-gf="民谣" onclick="filterDrawerGenre('民谣')">根源/民谣</button>
    </div>

    <div id="drawer-list"></div>
  </aside>

  <!-- 通用模态弹窗 -->
  <div class="modal-mask" id="main-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">窗口标题</span>
        <button class="zine-btn red" style="height:24px;padding:0 6px;" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 吐司提示 -->
  <div id="toast-box"></div>

  <script>
    /********************************************************************

    const FALLBACK_PROVINCES = [

      { name: "西藏", d: "M125,295 L275,285 L345,355 L335,455 L155,435 L115,360 Z" },

      { name: "广西", d: "M465,565 L565,565 L555,645 L455,635 Z" },
      { name: "海南", d: "M525,672 L568,672 L562,706 L520,702 Z" },
      { name: "香港", d: "M628,634 L644,634 L644,648 L628,648 Z" },
      { name: "澳门", d: "M610,638 L625,638 L625,652 L610,652 Z" },
      { name: "台湾", d: "M762,535 L786,530 L792,592 L766,598 Z" }
    ];

    // 经纬度转画布坐标 (适配 1000x780 标准中国投影)
    function lngLatToXY(lng, lat) {
      const x = (lng - 72) * (820 / 63) + 75;
      const y = (54 - lat) * (640 / 36) + 55;
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    }

    /********************************************************************
     * 6. 矢量地图渲染与 60FPS 硬件加速缩放平移引擎
     ********************************************************************/
    const mapViewport = document.getElementById("map-viewport");
    const mapStage = document.getElementById("map-stage");
    const layerProvinces = document.getElementById("layer-provinces");
    const layerCities = document.getElementById("layer-cities");
    const layerLandmarks = document.getElementById("layer-landmarks");
    const layerTraces = document.getElementById("layer-traces");

    let viewTransform = { x: 0, y: 0, k: 1 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1;

    function applyMapTransform(smooth = false) {
      mapStage.style.transition = smooth ? "transform 0.42s cubic-bezier(0.16, 1, 0.3, 1)" : "none";
      mapStage.style.transform = `translate3d(${viewTransform.x}px, ${viewTransform.y}px, 0) scale(${viewTransform.k})`;
    }

    function zoomMapBy(factor, cx, cy) {
      const rect = mapViewport.getBoundingClientRect();
      const centerX = cx !== undefined ? cx : rect.width / 2;
      const centerY = cy !== undefined ? cy : rect.height / 2;
      const nextK = Math.max(0.65, Math.min(7.5, viewTransform.k * factor));
      const ratio = nextK / viewTransform.k;
      viewTransform.x = centerX - (centerX - viewTransform.x) * ratio;
      viewTransform.y = centerY - (centerY - viewTransform.y) * ratio;
      viewTransform.k = nextK;
      applyMapTransform(true);
    }

    function resetMapView() {
      viewTransform = { x: 0, y: 0, k: 1 };
      applyMapTransform(true);
    }

    function flyToLngLat(lng, lat, targetK = 2.6) {
      const [svgX, svgY] = lngLatToXY(lng, lat);
      const rect = mapViewport.getBoundingClientRect();
      // 计算 SVG viewBox(1000x780) 在当前容器中的等比映射
      const scaleBase = Math.min(rect.width / 1000, rect.height / 780);
      const offsetX = (rect.width - 1000 * scaleBase) / 2;
      const offsetY = (rect.height - 780 * scaleBase) / 2;
      const px = offsetX + svgX * scaleBase;
      const py = offsetY + svgY * scaleBase;

      viewTransform.k = targetK;
      viewTransform.x = rect.width * 0.38 - px * targetK;
      viewTransform.y = rect.height * 0.48 - py * targetK;
      applyMapTransform(true);
    }

    // 1) 立即渲染内置离线34省轮廓（0等待秒开）
    function renderFallbackProvinces() {
      layerProvinces.innerHTML = FALLBACK_PROVINCES.map(p =>

    }

    // 2) 后台异步尝试拉取阿里云 DataV 标准中国全境高精度 GeoJSON 升级轮廓（绝不阻塞主线程）
    async function tryUpgradeHighResGeoJSON() {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json", { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) return;
        const geo = await res.json();
        if (!geo || !geo.features) return;
        const pathsHtml = [];
        geo.features.forEach(feat => {
          const geom = feat.geometry;
          if (!geom) return;
          const polys = geom.type === "Polygon" ? [geom.coordinates] : (geom.type === "MultiPolygon" ? geom.coordinates : []);
          const dParts = [];
          polys.forEach(poly => {
            poly.forEach(ring => {
              ring.forEach(([lng, lat], i) => {
                const [x, y] = lngLatToXY(lng, lat);
                dParts.push((i === 0 ? "M" : "L") + x + "," + y);
              });
              dParts.push("Z");
            });
          });
          if (dParts.length) {
            pathsHtml.push(`<path class="prov-path" d="${dParts.join(" ")}"><title>${feat.properties.name || ""}</title></path>`);
          }
        });
        if (pathsHtml.length > 20) {
          layerProvinces.innerHTML = pathsHtml.join("");
        }
      } catch (e) {
        // 离线或弱网下继续保持内置高精度版图，完全无感
      }
    }

    // 3) 渲染全国78座城市火漆印章节点
    function renderCityMarkers() {
      const html = [];
      Object.values(CITY_MAP).forEach(c => {
        const [x, y] = lngLatToXY(c.lng, c.lat);
        const cnt = c.bands.length;
        const r = cnt >= 25 ? 8.5 : (cnt >= 10 ? 6.8 : (cnt >= 5 ? 5.4 : 4.2));
        const fill = cnt >= 15 ? "#c92a2a" : (cnt >= 6 ? "#d97706" : "#141413");
        html.push(`
          <g class="city-node" transform="translate(${x},${y})" onclick="onCityNodeClick('${c.id}', event)">
            <circle class="city-ring" r="${r + 2.2}" fill="none" stroke="#141413" stroke-width="0.9" stroke-dasharray="2,1.5" />
            <circle r="${r}" fill="${fill}" stroke="#fff" stroke-width="1.2" />
            <text y="${-r - 3}" text-anchor="middle" font-size="${cnt >= 10 ? 9.5 : 8}" font-weight="900" fill="#141413" stroke="#ebe3d2" stroke-width="2.2" paint-order="stroke">${c.name}(${cnt})</text>
          </g>
        `);
      });
      layerCities.innerHTML = html.join("");
    }

    // 鼠标拖拽与触摸双指缩放绑定
    mapViewport.addEventListener("pointerdown", e => {
      if (e.target.closest(".city-node") || e.target.closest(".landmark-node")) return;
      isDragging = true;
      mapViewport.classList.add("grabbing");
      dragStart = { x: e.clientX - viewTransform.x, y: e.clientY - viewTransform.y };
    });
    window.addEventListener("pointermove", e => {
      if (!isDragging) return;
      viewTransform.x = e.clientX - dragStart.x;
      viewTransform.y = e.clientY - dragStart.y;
      applyMapTransform(false);
    });
    window.addEventListener("pointerup", () => {
      isDragging = false;
      mapViewport.classList.remove("grabbing");
    });
    mapViewport.addEventListener("wheel", e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.16 : 0.86;
      zoomMapBy(factor, e.clientX, e.clientY - 76);
    }, { passive: false });

    // 手机双指捏合缩放支持
    mapViewport.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialScale = viewTransform.k;
      }
    }, { passive: true });
    mapViewport.addEventListener("touchmove", e => {
      if (e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const nextK = Math.max(0.65, Math.min(7.5, initialScale * (dist / initialPinchDist)));
        viewTransform.k = nextK;
        applyMapTransform(false);
      }
    }, { passive: true });
    mapViewport.addEventListener("touchend", () => { initialPinchDist = null; });

    /********************************************************************
     * 7. 城市抽屉与虚拟分批渲染列表 (每次25条，滑动到底自动追加，绝不掉帧)
     ********************************************************************/
    let currentCityId = null;
    let currentGenreFilter = "ALL";
    let currentFilteredBands = [];
    let renderedCount = 0;
    const BATCH_SIZE = 25;
    const drawerEl = document.getElementById("city-drawer");
    const drawerListEl = document.getElementById("drawer-list");

    function onCityNodeClick(cityId, ev) {
      if (ev) ev.stopPropagation();
      openCityDrawer(cityId);
    }

    function openCityDrawer(cityId, highlightBandId = null) {
      const c = CITY_MAP[cityId];
      if (!c) return;
      currentCityId = cityId;
      currentGenreFilter = "ALL";
      document.querySelectorAll("#city-drawer [data-gf]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-gf") === "ALL");
      });

      document.getElementById("drw-prov").textContent = c.prov + " · 摇滚档案袋";
      document.getElementById("drw-city").textContent = c.name;
      document.getElementById("drw-desc").textContent = c.desc;
      document.getElementById("btn-drw-add").onclick = () => openAddBandModal(cityId);

      flyToLngLat(c.lng, c.lat, 2.5);
      drawerEl.classList.add("open");
      refreshDrawerBands(highlightBandId);
    }

    function closeCityDrawer() {
      drawerEl.classList.remove("open");
    }

    function filterDrawerGenre(gf) {
      currentGenreFilter = gf;
      document.querySelectorAll("#city-drawer [data-gf]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-gf") === gf);
      });
      refreshDrawerBands(null);
    }

    function refreshDrawerBands(highlightBandId = null) {
      const c = CITY_MAP[currentCityId];
      if (!c) return;
      currentFilteredBands = c.bands.filter(b => {
        if (currentGenreFilter === "ALL") return true;
        return b.genre.includes(currentGenreFilter);
      });

      // 若指定高亮乐队排在后面，确保包含它的批次被渲染
      let minRender = BATCH_SIZE;
      if (highlightBandId) {
        const idx = currentFilteredBands.findIndex(b => b.id === highlightBandId);
        if (idx >= 0) minRender = Math.max(BATCH_SIZE, idx + 5);
      }

      document.getElementById("drw-count").textContent = currentFilteredBands.length;
      drawerListEl.innerHTML = "";
      renderedCount = 0;
      appendDrawerBatch(minRender);

      if (highlightBandId) {
        setTimeout(() => {
          const card = document.getElementById("card-" + highlightBandId);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.add("flash");
            setTimeout(() => card.classList.remove("flash"), 2800);
          }
        }, 120);
      }
    }

      if (genre.includes("朋克") || genre.includes("硬核")) return "punk";
      if (genre.includes("金属") || genre.includes("核")) return "metal";
      if (genre.includes("民谣")) return "folk";
      return "indie";
    }

    function appendDrawerBatch(count = BATCH_SIZE) {
      if (renderedCount >= currentFilteredBands.length) return;
      const slice = currentFilteredBands.slice(renderedCount, renderedCount + count);
      renderedCount += slice.length;
      const temp = document.createElement("div");
      temp.innerHTML = slice.map(renderBandCardHtml).join("");
      while (temp.firstChild) drawerListEl.appendChild(temp.firstChild);
    }

    drawerListEl.addEventListener("scroll", () => {

    function submitBandPost(bandId) {
      const txt = document.getElementById("post-text").value.trim();
      const photographer = document.getElementById("img-photographer").value.trim() || appState.handle;
      const year = document.getElementById("img-year").value.trim() || "2026";
      const source = document.getElementById("img-source").value;
      const license = document.getElementById("img-license").value;
      const fileInput = document.getElementById("post-file");

      if (!txt && (!fileInput.files || !fileInput.files[0])) {
        showToast("请填写留言或选择一张图片");
        return;
      }

      const finishSave = (base64Img) => {
        if (!appState.posts[bandId]) appState.posts[bandId] = [];
        const newPost = {
          id: "P" + Date.now(),
          author: appState.handle,
          text: txt || "上传了现场影像文献",
          img: base64Img,
          imgMeta: { photographer, year, source, license },
          time: "2026-10-25",
          reported: false,
          hidden: false
        };
        appState.posts[bandId].unshift(newPost);
        addPoints(15, "上传合规影像/留言");
        openBandPostsModal(bandId);
        if (currentCityId) refreshDrawerBands(null);
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 520;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            finishSave(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSave(null);
      }
    }
