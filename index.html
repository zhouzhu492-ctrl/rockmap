<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>中国地下摇滚声音地图 · 1380+全量乐队大典</title>
  <style>
    :root {
      --paper: #eae0c8;
      --paper-dark: #dacbb0;
      --ink: #141312;
      --crimson: #c92a2a;
      --amber: #d97706;
      --teal: #0f766e;
      --green: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background-color: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none; -webkit-user-select: none;
      overscroll-behavior: none;
    }

    /* 轻量级复古网点纹理（零GPU负担） */
    .zine-texture {
      position: fixed; inset: 0; pointer-events: none; z-index: 15; opacity: 0.12;
      background-image: radial-gradient(var(--ink) 0.75px, transparent 0.75px);
      background-size: 11px 11px;
    }

    /* 顶部主控台（针对手机窄屏深度优化） */
    #top-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--paper); border-bottom: 3px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink); padding: 6px 8px;
    }
    .header-row-1 {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px;
    }
    .brand-box { display: flex; align-items: center; gap: 5px; }
    .brand-stamp {
      background: var(--crimson); color: #fff; font-weight: 900; font-size: 10px;
      padding: 2px 5px; border: 1.5px solid var(--ink);
    }
    .brand-title { font-size: 15px; font-weight: 900; letter-spacing: -0.5px; }
    .search-bar-wrap {
      position: relative; flex: 1; min-width: 190px; max-width: 500px; display: flex; gap: 4px;
    }
    #search-input {
      flex: 1; width: 100%; height: 32px; padding: 0 8px; font-size: 13px; font-weight: 700;
      background: #fff; border: 2px solid var(--ink); color: var(--ink); outline: none;
      border-radius: 0; -webkit-appearance: none; user-select: text; -webkit-user-select: text;
    }
    #search-input:focus { background: #fff9db; }
    .zine-btn {
      height: 32px; padding: 0 8px; font-size: 11px; font-weight: 900;
      border: 2px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 2px; white-space: nowrap;
    }
    .zine-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .zine-btn.red { background: var(--crimson); color: #fff; }
    .zine-btn.dark { background: var(--ink); color: var(--paper); }
    .zine-btn.amber { background: #fef08a; color: var(--ink); }

    .header-row-2 {
      display: flex; align-items: center; gap: 5px; overflow-x: auto;
      padding-top: 5px; margin-top: 5px; border-top: 1px dashed rgba(20,19,18,0.3);
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .header-row-2::-webkit-scrollbar { display: none; }
    .sm-btn {
      height: 26px; padding: 0 8px; font-size: 11px; font-weight: 800;
      border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 1.5px 1.5px 0 var(--ink); cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .sm-btn.active { background: var(--crimson); color: #fff; }

    /* 搜索下拉列表（绝对置顶） */
    #search-dropdown {
      position: fixed; z-index: 99999; display: none;
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink); max-height: 60vh; overflow-y: auto;
      width: min(94vw, 460px); -webkit-overflow-scrolling: touch;
    }
    .search-item {
      padding: 9px 10px; border-bottom: 1px dashed rgba(20,19,18,0.25);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.92);
    }
    .search-item:active { background: #fef08a; }

    /* 高帧率手机兼容地图视口 */
    #map-viewport {
      position: fixed; left: 0; right: 0; bottom: 0; top: 82px; z-index: 5;
      overflow: hidden; touch-action: none;
      background: radial-gradient(circle at 50% 45%, #f4ecda 0%, #dfd2b6 75%, #ccbba0 100%);
    }
    #map-svg {
      width: 100%; height: 100%; display: block;
      transform-origin: 0 0;
    }
    .prov-shadow {
      fill: var(--crimson); opacity: 0.75; pointer-events: none;
    }
    .prov-land {
      fill: #dfd2b5; stroke: #141312; stroke-width: 1.1px;
      stroke-linejoin: round; cursor: pointer;
    }
    .prov-land:active, .prov-land:hover { fill: #f3da9b; }
    .prov-label {
      font-size: 9px; font-weight: 900; fill: rgba(20,19,18,0.42);
      pointer-events: none;
    }
    .city-pin { cursor: pointer; }
    .landmark-pin { cursor: pointer; }

    /* 左下角缩放控件 */
    #map-controls {
      position: fixed; left: 10px; bottom: 16px; z-index: 500;
      display: flex; flex-direction: column; gap: 6px;
    }
    .ctrl-btn {
      width: 38px; height: 38px; font-size: 17px; font-weight: 900;
      background: var(--paper); border: 2px solid var(--ink);
      box-shadow: 2.5px 2.5px 0 var(--ink); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:active { transform: translate(1px, 1px); }

    /* 右下角统计铭牌 */
    #stats-badge {
      position: fixed; right: 10px; bottom: 16px; z-index: 400;
      background: rgba(234, 224, 200, 0.94); border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); padding: 5px 8px; font-size: 10.5px;
      pointer-events: none; max-width: 68vw;
    }

    /* 路线/足迹激活顶部提示条 */
    #trace-banner {
      position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
      z-index: 800; display: none; background: var(--ink); color: #fef08a;
      border: 2px solid #fef08a; box-shadow: 3px 3px 0 var(--crimson);
      padding: 6px 10px; font-size: 11px; font-weight: 800;
      align-items: center; gap: 8px; width: max-content; max-width: 92vw;
    }

    /* 城市抽屉面板（手机底部弹出，电脑右侧滑出） */
    #city-drawer {
      position: fixed; top: 82px; right: 0; bottom: 0;
      width: min(100vw, 520px); background: var(--paper);
      border-left: 3.5px solid var(--ink); box-shadow: -5px 0 0 rgba(20,19,18,0.9);
      z-index: 1200; transform: translateX(105%);
      transition: transform 0.24s ease-out;
      display: flex; flex-direction: column;
    }
    #city-drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 10px 12px; background: var(--paper-dark);
      border-bottom: 2.5px solid var(--ink); flex-shrink: 0;
    }
    .drawer-filter-bar {
      padding: 6px 10px; background: #e5dcc6; border-bottom: 2px solid var(--ink);
      display: flex; gap: 4px; align-items: center; overflow-x: auto;
      flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .drawer-filter-bar::-webkit-scrollbar { display: none; }
    #drawer-list {
      flex: 1; overflow-y: auto; padding: 10px 10px 70px;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }

    /* 乐队文献卡片 */
    .band-card {
      background: #fff; border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); padding: 10px; margin-bottom: 10px;
    }
    .band-card.flash {
      background: #fef08a; border-color: var(--crimson);
    }
    .badge {
      display: inline-block; padding: 1px 5px; font-size: 10px; font-weight: 800;
      border: 1px solid var(--ink); margin-right: 3px;
    }
    .badge.punk { background: var(--crimson); color: #fff; }
    .badge.metal { background: var(--ink); color: #fef08a; }
    .badge.indie { background: #0f766e; color: #fff; }
    .badge.folk { background: #b45309; color: #fff; }
    .stream-links {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px;
      padding-top: 6px; border-top: 1px dashed rgba(20,19,18,0.25);
    }
    .stream-a {
      font-size: 10px; font-weight: 800; padding: 3px 6px;
      border: 1px solid var(--ink); text-decoration: none; color: var(--ink);
      background: #fff;
    }
    .stream-a.wy { background: #fee2e2; color: #991b1b; }
    .stream-a.qq { background: #dcfce7; color: #166534; }
    .stream-a.bl { background: #e0f2fe; color: #075985; }
    .stream-a.yt { background: #f3f4f6; color: #1f2937; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .act-btn {
      font-size: 10.5px; font-weight: 800; padding: 3px 7px;
      border: 1.5px solid var(--ink); background: var(--paper); cursor: pointer;
    }
    .act-btn:active { background: #fef08a; }

    /* 模态弹窗 */
    .modal-mask {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(15,15,15,0.75); display: none;
      align-items: center; justify-content: center; padding: 10px;
    }
    .modal-box {
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink); width: 100%; max-width: 540px;
      max-height: 85vh; max-height: 85dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      padding: 10px 12px; background: var(--ink); color: var(--paper);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-size: 13.5px; flex-shrink: 0;
    }
    .modal-body {
      padding: 12px; overflow-y: auto; flex: 1; font-size: 12px;
      -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 7px 8px; font-size: 13px; font-weight: 700;
      border: 2px solid var(--ink); background: #fff; margin-top: 3px; margin-bottom: 8px;
      border-radius: 0; -webkit-appearance: none;
    }
    #toast-box {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 99999; background: var(--ink); color: #fef08a;
      border: 2px solid #fff; box-shadow: 3px 3px 0 var(--crimson);
      padding: 7px 14px; font-size: 12px; font-weight: 900; display: none;
      white-space: nowrap;
    }

    @media (max-width: 680px) {
      #top-header { padding: 5px 6px; }
      .brand-title { font-size: 13.5px; }
      .search-bar-wrap { width: 100%; min-width: 100%; order: 3; margin-top: 2px; }
      #map-viewport { top: 112px; }
      #trace-banner { top: 118px; }
      #city-drawer {
        top: auto; left: 0; right: 0; bottom: 0;
        height: 80vh; height: 80dvh; width: 100vw;
        border-left: none; border-top: 3.5px solid var(--ink);
        transform: translateY(105%);
      }
      #city-drawer.open { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="zine-texture"></div>

  <!-- 顶部主控台（已彻底移除公开审核按钮） -->
  <header id="top-header">
    <div class="header-row-1">
      <div class="brand-box">
        <span class="brand-stamp">ROCK ATLAS</span>
        <h1 class="brand-title">中国摇滚声音地图</h1>
        <span id="top-count-tag" style="font-size:10px;font-weight:900;background:#141312;color:#fef08a;padding:1px 5px;">1386 支乐队</span>
      </div>

      <div class="search-bar-wrap" id="search-wrap">
        <input id="search-input" type="search" placeholder="搜乐队/城市/代表作 (如: 孤独的利里 / Lur / 万青)..." autocomplete="off" />
        <button class="zine-btn dark" id="btn-do-search">搜索</button>
        <button class="zine-btn amber" id="btn-random-band">🎲 随机</button>
        <button class="zine-btn red" id="btn-open-add">＋ 补录</button>
      </div>
    </div>

    <!-- 第二排：公开文化功能栏（无审核队列，仅站长模式显示隐藏入口） -->
    <div class="header-row-2">
      <button class="sm-btn" id="btn-daily-rec">📅 今日声波推荐</button>
      <button class="sm-btn active" id="btn-toggle-landmarks">🏛️ 摇滚地标 (开)</button>
      <button class="sm-btn" id="btn-open-routes">🚩 朝圣路线</button>
      <button class="sm-btn" id="btn-open-rank">📊 城市榜 & 冷门特集</button>
      <button class="sm-btn" id="btn-open-favs">⭐ 收藏清单 (<span id="fav-num">0</span>)</button>
      <button class="sm-btn" id="btn-open-profile">🏅 贡献者徽章 (<span id="pts-num">120</span>分)</button>
      <!-- 站长私有按钮：普通用户完全不可见，仅通过 ?admin=1 或暗号解锁 -->
      <button class="sm-btn active" id="btn-secret-admin" style="display:none;background:#141312;color:#fef08a;">🔒 站长后台 (<span id="mod-num">0</span>)</button>
    </div>
  </header>

  <!-- 搜索下拉框 -->
  <div id="search-dropdown"></div>

  <!-- 路线/足迹激活横幅 -->
  <div id="trace-banner">
    <span id="trace-banner-text">当前轨迹模式</span>
    <button class="sm-btn active" onclick="clearMapTraces()">✕ 退出</button>
  </div>

  <!-- 手机端 60FPS 零滤镜丝网错版中国全境矢量地图 -->
  <main id="map-viewport">
    <svg id="map-svg" viewBox="0 0 1050 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="zine-grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#141312" stroke-width="0.35" stroke-opacity="0.15" />
        </pattern>
      </defs>

      <!-- 背景经纬网格 -->
      <rect x="-500" y="-400" width="2200" height="1600" fill="url(#zine-grid)" />

      <!-- 丝网错版红影层（零GPU损耗替代滤镜） -->
      <g id="layer-prov-shadow" transform="translate(3.5, 3.5)"></g>
      <!-- 中国34省区主体层 -->
      <g id="layer-provinces"></g>

      <!-- 南海诸岛九段线标准附图框 -->
      <g id="layer-south-sea" transform="translate(805, 545)">
        <rect x="3" y="3" width="128" height="162" fill="#141312" />
        <rect x="0" y="0" width="128" height="162" fill="#e6dac0" stroke="#141312" stroke-width="2" />
        <rect x="0" y="0" width="128" height="18" fill="#141312" />
        <text x="64" y="13" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fef08a">南海诸岛 (中国版图)</text>
        <path d="M22,38 Q32,33 38,42 Q32,52 20,47 Z" fill="#dfd2b5" stroke="#141312" stroke-width="1"/>
        <circle cx="52" cy="64" r="2.2" fill="#c92a2a" /><text x="58" y="67" font-size="7.5" font-weight="800">西沙</text>
        <circle cx="75" cy="78" r="2.2" fill="#c92a2a" /><text x="81" y="81" font-size="7.5" font-weight="800">中沙</text>
        <circle cx="64" cy="118" r="2.5" fill="#c92a2a" /><text x="70" y="121" font-size="7.5" font-weight="800">南沙</text>
        <path d="M98,32 L92,48 M104,64 L98,82 M96,102 L86,120 M76,136 L58,146 M40,142 L26,128 M20,106 L24,86 M28,68 L36,54" stroke="#c92a2a" stroke-width="2" fill="none" />
      </g>

      <!-- 朝圣路线与乐队足迹连线层 -->
      <g id="layer-traces"></g>
      <!-- 历史场景地标图层 -->
      <g id="layer-landmarks"></g>
      <!-- 全国82座摇滚城市印章层 -->
      <g id="layer-cities"></g>
    </svg>
  </main>

  <!-- 左下角缩放控件 -->
  <div id="map-controls">
    <button class="ctrl-btn" onclick="zoomBy(1.3)" aria-label="放大">＋</button>
    <button class="ctrl-btn" onclick="zoomBy(0.75)" aria-label="缩小">－</button>
    <button class="ctrl-btn" onclick="resetMapView()" style="font-size:11px;">全境</button>
  </div>

  <!-- 右下角统计铭牌 -->
  <div id="stats-badge">
    <div>收录：<strong id="stat-city-cnt">82</strong> 城 | <strong id="stat-band-cnt" style="color:var(--crimson);">1386</strong> 支乐队</div>
    <div style="font-size:9.5px;opacity:0.8;">单指拖动 / 双指缩放 / 点击城市或省份展开</div>
  </div>

  <!-- 城市乐队抽屉 -->
  <aside id="city-drawer">
    <div class="drawer-head">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <span id="drw-prov" class="brand-stamp" style="display:inline-block;margin-bottom:3px;">省份</span>
          <h2 id="drw-city" style="font-size:19px;font-weight:900;">城市名称</h2>
        </div>
        <div style="display:flex;gap:5px;">
          <button class="zine-btn red" id="btn-drw-add" style="height:28px;font-size:11px;">＋ 加乐队</button>
          <button class="zine-btn dark" onclick="closeCityDrawer()" style="height:28px;">✕ 关闭</button>
        </div>
      </div>
      <p id="drw-desc" style="font-size:11px;margin-top:4px;line-height:1.35;opacity:0.88;"></p>
    </div>

    <div class="drawer-filter-bar">
      <span style="font-size:11px;font-weight:900;flex-shrink:0;">共 <strong id="drw-count" style="color:var(--crimson);">0</strong> 支：</span>
      <button class="sm-btn active" data-gf="ALL" onclick="filterDrawerGenre('ALL')">全部</button>
      <button class="sm-btn" data-gf="朋克" onclick="filterDrawerGenre('朋克')">朋克/硬核</button>
      <button class="sm-btn" data-gf="金属" onclick="filterDrawerGenre('金属')">重金属/核</button>
      <button class="sm-btn" data-gf="后朋" onclick="filterDrawerGenre('后朋')">后朋/冷潮</button>
      <button class="sm-btn" data-gf="后摇" onclick="filterDrawerGenre('后摇')">后摇/数学</button>
      <button class="sm-btn" data-gf="独立" onclick="filterDrawerGenre('独立')">独立/迷幻</button>
      <button class="sm-btn" data-gf="民谣" onclick="filterDrawerGenre('民谣')">根源/民谣</button>
    </div>

    <div id="drawer-list"></div>
  </aside>

  <!-- 通用模态弹窗 -->
  <div class="modal-mask" id="main-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">窗口标题</span>
        <button class="zine-btn red" style="height:24px;padding:0 6px;" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-box"></div>

  <script>
    /********************************************************************
     * 0. 站长私有管理后台密钥配置（普通用户不可见）
     * 进入方式1：网址末尾加 ?admin=1
     * 进入方式2：在顶部搜索框输入 admin888 点搜索
     ********************************************************************/
    const ADMIN_SECRET = "admin888";
    let isAdminUnlocked = window.location.search.includes("admin=1") || window.location.hash.includes("admin");

    function unlockAdminMode() {
      isAdminUnlocked = true;
      const btn = document.getElementById("btn-secret-admin");
      if (btn) btn.style.display = "inline-flex";
      showToast("🔓 站长私有管理后台已解锁");
      renderModQueueModal();
    }

    /********************************************************************
     * 1. 兰伯特仿真投影转换 + 中国34省区自然曲线多边形
     ********************************************************************/
    function lngLatToXY(lng, lat) {
      const radLat = (lat * Math.PI) / 180;
      const centralLng = 104.5;
      const x = 515 + (lng - centralLng) * Math.cos(radLat * 0.72) * 14.8;
      const y = 415 - (lat - 35.0) * 16.2 + Math.pow(lng - centralLng, 2) * 0.042;
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    }

    const mapViewport = document.getElementById("map-viewport");
    const mapSvg = document.getElementById("map-svg");
    const layerProvShadow = document.getElementById("layer-prov-shadow");
    const layerProvinces = document.getElementById("layer-provinces");
    const layerCities = document.getElementById("layer-cities");
    const layerLandmarks = document.getElementById("layer-landmarks");
    const layerTraces = document.getElementById("layer-traces");

    let viewTransform = { x: 0, y: 0, k: 1 };

    function applyTransform(smooth = false) {
      mapSvg.style.transition = smooth ? "transform 0.35s ease-out" : "none";
      mapSvg.style.transform = `translate(${viewTransform.x}px, ${viewTransform.y}px) scale(${viewTransform.k})`;
    }

    function zoomBy(factor, cx, cy) {
      const rect = mapViewport.getBoundingClientRect();
      const centerX = cx !== undefined ? cx : rect.width / 2;
      const centerY = cy !== undefined ? cy : rect.height / 2;
      const nextK = Math.max(0.75, Math.min(7, viewTransform.k * factor));
      const ratio = nextK / viewTransform.k;
      viewTransform.x = centerX - (centerX - viewTransform.x) * ratio;
      viewTransform.y = centerY - (centerY - viewTransform.y) * ratio;
      viewTransform.k = nextK;
      applyTransform(true);
    }

    function resetMapView() {
      viewTransform = { x: 0, y: 0, k: 1 };
      applyTransform(true);
    }

    function flyToLngLat(lng, lat, targetK = 2.4) {
      const [svgX, svgY] = lngLatToXY(lng, lat);
      const rect = mapViewport.getBoundingClientRect();
      const scaleBase = Math.min(rect.width / 1050, rect.height / 800);
      const offsetX = (rect.width - 1050 * scaleBase) / 2;
      const offsetY = (rect.height - 800 * scaleBase) / 2;
      const px = offsetX + svgX * scaleBase;
      const py = offsetY + svgY * scaleBase;

      viewTransform.k = targetK;
      const isMobile = window.innerWidth <= 680;
      viewTransform.x = (isMobile ? rect.width * 0.5 : rect.width * 0.36) - px * targetK;
      viewTransform.y = (isMobile ? rect.height * 0.28 : rect.height * 0.48) - py * targetK;
      applyTransform(true);
    }

    function pointsToSmoothPath(pts) {
      const xy = pts.map(([lng, lat]) => lngLatToXY(lng, lat));
      if (xy.length < 3) return "";
      let d = `M ${xy[0][0]},${xy[0][1]} `;
      for (let i = 0; i < xy.length; i++) {
        const p0 = xy[(i - 1 + xy.length) % xy.length];
        const p1 = xy[i];
        const p2 = xy[(i + 1) % xy.length];
        const p3 = xy[(i + 2) % xy.length];
        const cp1x = Math.round((p1[0] + (p2[0] - p0[0]) * 0.16) * 10) / 10;
        const cp1y = Math.round((p1[1] + (p2[1] - p0[1]) * 0.16) * 10) / 10;
        const cp2x = Math.round((p2[0] - (p3[0] - p1[0]) * 0.16) * 10) / 10;
        const cp2y = Math.round((p2[1] - (p3[1] - p1[1]) * 0.16) * 10) / 10;
        d += `C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0]},${p2[1]} `;
      }
      return d + "Z";
    }

    // 统一无冲突的手机触摸 + 电脑鼠标平移缩放控制
    let touchMode = null; // 'drag' | 'pinch'
    let startPt = { x: 0, y: 0 };
    let startTrans = { x: 0, y: 0, k: 1 };
    let startDist = 0;

    mapViewport.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        touchMode = "drag";
        startPt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        startTrans = { ...viewTransform };
      } else if (e.touches.length === 2) {
        touchMode = "pinch";
        startDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        startTrans = { ...viewTransform };
      }
    }, { passive: true });

    mapViewport.addEventListener("touchmove", e => {
      if (touchMode === "drag" && e.touches.length === 1) {
        const dx = e.touches[0].clientX - startPt.x;
        const dy = e.touches[0].clientY - startPt.y;
        viewTransform.x = startTrans.x + dx;
        viewTransform.y = startTrans.y + dy;
        applyTransform(false);
      } else if (touchMode === "pinch" && e.touches.length === 2 && startDist > 10) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - 90;
        const nextK = Math.max(0.75, Math.min(7, startTrans.k * (dist / startDist)));
        const ratio = nextK / startTrans.k;
        viewTransform.x = cx - (cx - startTrans.x) * ratio;
        viewTransform.y = cy - (cy - startTrans.y) * ratio;
        viewTransform.k = nextK;
        applyTransform(false);
      }
    }, { passive: true });

    mapViewport.addEventListener("touchend", () => { touchMode = null; });

    // 桌面鼠标支持

      mouseDown = true;
      startPt = { x: e.clientX, y: e.clientY };
      startTrans = { ...viewTransform };
    });
    window.addEventListener("mousemove", e => {
      if (!mouseDown) return;
      viewTransform.x = startTrans.x + (e.clientX - startPt.x);
      viewTransform.y = startTrans.y + (e.clientY - startPt.y);
      applyTransform(false);
    });
    window.addEventListener("mouseup", () => { mouseDown = false; });

        b.classList.toggle("active", b.getAttribute("data-gf") === gf);
      });
      refreshDrawerBands(null);
    }

    function refreshDrawerBands(highlightBandId = null) {
      const c = CITY_MAP[currentCityId];
      if (!c) return;
      currentFilteredBands = c.bands.filter(b => {
        if (currentGenreFilter === "ALL") return true;
        return b.genre.includes(currentGenreFilter);
      });

      let minRender = BATCH_SIZE;
      if (highlightBandId) {
        const idx = currentFilteredBands.findIndex(b => b.id === highlightBandId);
        if (idx >= 0) minRender = Math.max(BATCH_SIZE, idx + 4);
      }

      document.getElementById("drw-count").textContent = currentFilteredBands.length;
      drawerListEl.innerHTML = "";
      renderedCount = 0;
      appendDrawerBatch(minRender);

      if (highlightBandId) {
        setTimeout(() => {
          const card = document.getElementById("card-" + highlightBandId);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.add("flash");
            setTimeout(() => card.classList.remove("flash"), 2600);
          }
        }, 120);
      }
    }

    function getGenreBadgeClass(genre) {
      if (genre.includes("朋克") || genre.includes("硬核")) return "punk";
      if (genre.includes("金属") || genre.includes("核")) return "metal";
      if (genre.includes("民谣")) return "folk";
      return "indie";
    }

    function renderBandCardHtml(b) {
      const isFav = appState.favBands.includes(b.id);
      const posts = (appState.posts[b.id] || []).filter(p => !p.hidden);
      const q = encodeURIComponent(b.name.replace(/\(.*\)/g, ""));
      return `
        <article class="band-card" id="card-${b.id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
            <div>
              <span class="badge ${getGenreBadgeClass(b.genre)}">${b.genre}</span>
              <span class="badge" style="background:#eee;">${b.year}</span>
              ${b.claimed ? `<span class="badge" style="background:#15803d;color:#fff;">✓ 官方认证</span>` : ""}
              <h3 style="font-size:15.5px;font-weight:900;margin-top:3px;">${b.name}</h3>
            </div>
            <button class="act-btn" onclick="toggleFavBand('${b.id}')" style="background:${isFav ? '#fef08a' : '#fff'};">
              ${isFav ? "★ 已想看" : "☆ 想去现场"}
            </button>
          </div>

          <div style="margin-top:5px;font-size:11px;font-weight:800;color:var(--crimson);">
            代表作：${b.works}
          </div>
          <p style="margin-top:4px;font-size:11px;line-height:1.45;color:#2b2927;">${b.desc}</p>

          <div class="stream-links">
            <span style="font-size:10px;font-weight:900;align-self:center;">🎧 试听：</span>
            <a class="stream-a wy" href="https://music.163.com/#/search/m/?s=${q}" target="_blank" rel="noopener">网易云 ↗</a>
            <a class="stream-a qq" href="https://y.qq.com/n/ryqq/search?w=${q}" target="_blank" rel="noopener">QQ音乐 ↗</a>
            <a class="stream-a bl" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(b.name + ' 现场 Live')}" target="_blank" rel="noopener">B站现场 ↗</a>
            <a class="stream-a yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube ↗</a>
          </div>

            <button class="act-btn" onclick="showBandFootprint('${b.id}')">🕸️ 足迹连线</button>

            <button class="act-btn" onclick="openClaimModal('${b.id}')">🎸 认领</button>
          </div>
        </article>
      `;
    }

    function appendDrawerBatch(count = BATCH_SIZE) {
      if (renderedCount >= currentFilteredBands.length) return;
      const slice = currentFilteredBands.slice(renderedCount, renderedCount + count);
      renderedCount += slice.length;
      const temp = document.createElement("div");
      temp.innerHTML = slice.map(renderBandCardHtml).join("");
      while (temp.firstChild) drawerListEl.appendChild(temp.firstChild);
    }

    drawerListEl.addEventListener("scroll", () => {
      if (drawerListEl.scrollTop + drawerListEl.clientHeight >= drawerListEl.scrollHeight - 160) {
        appendDrawerBatch(BATCH_SIZE);
      }
    });

    /********************************************************************
     * 7. 搜索系统（内置站长暗号识别）
     ********************************************************************/
    const searchInput = document.getElementById("search-input");
    const searchDropdown = document.getElementById("search-dropdown");

    function executeSearch() {
      const raw = searchInput.value.trim();
      if (!raw) { searchDropdown.style.display = "none"; return; }

      // 若输入的是站长私有暗号，直接解锁并打开私有审核后台
      if (raw.toLowerCase() === ADMIN_SECRET) {
        searchInput.value = "";
        searchDropdown.style.display = "none";
        unlockAdminMode();
        return;
      }

      const kw = raw.toLowerCase();
      const rect = document.getElementById("search-wrap").getBoundingClientRect();
      searchDropdown.style.top = (rect.bottom + 4) + "px";
      searchDropdown.style.left = Math.max(6, rect.left) + "px";

      const matched = BANDS_DB.filter(b =>
        b.name.toLowerCase().includes(kw) ||
        b.cityName.toLowerCase().includes(kw) ||
        b.prov.toLowerCase().includes(kw) ||
        b.works.toLowerCase().includes(kw) ||
        b.genre.toLowerCase().includes(kw)
      ).slice(0, 35);

      if (matched.length === 0) {
        searchDropdown.innerHTML = `
          <div style="padding:12px;font-size:12px;font-weight:800;">
            未找到“${raw}”相关乐队。
            <button class="zine-btn red" style="margin-left:6px;height:26px;" onclick="searchDropdown.style.display='none';openAddBandModal()">＋ 立即补录</button>
          </div>
        `;
      } else {
        searchDropdown.innerHTML = `
          <div style="padding:6px 10px;background:#141312;color:#fef08a;font-size:11px;font-weight:900;display:flex;justify-content:space-between;">
            <span>找到 ${matched.length} 条结果（点击定位）</span>
            <span style="cursor:pointer;" onclick="searchDropdown.style.display='none'">✕ 关闭</span>
          </div>
          ${matched.map(b => `
            <div class="search-item" onclick="selectSearchResult('${b.cityId}', '${b.id}')">
              <div>
                <div style="font-size:13px;font-weight:900;">${b.name} <span style="font-size:10px;color:var(--crimson);">[${b.prov}·${b.cityName}]</span></div>
                <div style="font-size:10px;opacity:0.75;">${b.year} · ${b.genre} · ${b.works}</div>
              </div>
              <span style="font-size:11px;font-weight:900;color:var(--crimson);">直达 ➔</span>
            </div>
          `).join("")}
        `;
      }
      searchDropdown.style.display = "block";
    }

      openCityDrawer(cityId, bandId);

      const list = (appState.posts[bandId] || []).filter(p => !p.hidden);
      openModal(`📸 【${b.name}】返图与留言墙`, `
        <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:12px;">
          <h4 style="font-weight:900;margin-bottom:6px;">＋ 上传现场门票/照片或留言</h4>
          <textarea id="post-text" class="form-textarea" rows="2" placeholder="写下你的现场回忆或乐评..."></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <div>
              <label style="font-size:10px;font-weight:900;">拍摄者署名*</label>
              <input id="img-photographer" class="form-input" value="${appState.handle}" />
            </div>
            <div>
              <label style="font-size:10px;font-weight:900;">拍摄年份*</label>
              <input id="img-year" class="form-input" value="2026" />
            </div>
            <div>
              <label style="font-size:10px;font-weight:900;">图片来源*</label>
              <select id="img-source" class="form-select">
                <option value="本人现场实拍">本人现场实拍</option>
                <option value="实体门票/唱片扫描">实体门票/唱片扫描</option>
                <option value="乐队授权海报">乐队授权海报</option>
              </select>
            </div>
            <div>
              <label style="font-size:10px;font-weight:900;">授权协议*</label>
              <select id="img-license" class="form-select">
                <option value="CC BY-NC-SA 4.0">CC BY-NC-SA 4.0</option>
                <option value="CC BY 4.0">CC BY 4.0</option>
              </select>
            </div>
          </div>
          <label style="font-size:10px;font-weight:900;">上传图片（可选）：</label>
          <input type="file" id="post-file" accept="image/*" class="form-input" />
          <button class="zine-btn red" style="width:100%;" onclick="submitBandPost('${bandId}')">📤 发布 (+15分)</button>
        </div>
        <h4 style="font-weight:900;margin-bottom:6px;">乐迷返图档案 (${list.length})：</h4>
        ${list.length === 0 ? `<p style="opacity:0.7;">暂无返图，来上传第一张现场票根吧！</p>` : list.map(p => `
          <div style="border:1.5px solid #141312;background:#fff;padding:8px;margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;">
              <span>👤 ${p.author} · ${p.time}</span>
              <button class="act-btn" style="color:var(--crimson);" onclick="reportPost('${bandId}','${p.id}')">⚠️ 举报</button>
            </div>
            <p style="margin:5px 0;font-weight:700;">${p.text}</p>
            ${p.img ? `
              <img src="${p.img}" style="max-width:100%;max-height:200px;border:1px solid #141312;margin-top:4px;" />
              <div style="font-size:9.5px;background:#eee;padding:3px 6px;margin-top:2px;">
                📷 ${p.imgMeta.photographer} | ${p.imgMeta.year} | ${p.imgMeta.source} | ${p.imgMeta.license}
              </div>
            ` : ""}
          </div>
        `).join("")}
      `);
    }

    function submitBandPost(bandId) {
      const txt = document.getElementById("post-text").value.trim();
      const photographer = document.getElementById("img-photographer").value.trim() || appState.handle;
      const year = document.getElementById("img-year").value.trim() || "2026";
      const source = document.getElementById("img-source").value;
      const license = document.getElementById("img-license").value;
      const fileInput = document.getElementById("post-file");

      if (!txt && (!fileInput.files || !fileInput.files[0])) {
        showToast("请填写留言或选择图片");
        return;
      }
      const finishSave = (base64Img) => {
        if (!appState.posts[bandId]) appState.posts[bandId] = [];
        appState.posts[bandId].unshift({
          id: "P" + Date.now(),
          author: appState.handle,
          text: txt || "分享了现场影像",
          img: base64Img,
          imgMeta: { photographer, year, source, license },
          time: "2026-10-25",
          reported: false,
          hidden: false
        });
        addPoints(15, "发布影像/留言");
        openBandPostsModal(bandId);
        if (currentCityId) refreshDrawerBands(null);
      };
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 480;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            finishSave(canvas.toDataURL("image/jpeg", 0.62));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSave(null);
      }
    }

    function reportPost(bandId, postId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      const p = (appState.posts[bandId] || []).find(x => x.id === postId);
      if (!p) return;
      p.reported = true;
      appState.modQueue.unshift({
        id: "M" + Date.now(),
        type: "REPORT_POST",
        bandId,
        postId,
        bandName: b ? b.name : bandId,
        applicant: appState.handle,
        note: `举报图文：“${p.text.slice(0, 25)}”`,
        status: "PENDING",
        time: "2026-10-25"
      });
      saveState();
      showToast("⚠️ 已反馈给站长后台处理");
    }

    function openEditBandModal(bandId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      if (!b) return;
      openModal(`✏️ 勘误编辑：【${b.name}】`, `
        <label style="font-weight:900;">成立年份：</label>
        <input id="ed-year" class="form-input" value="${b.year}" />
        <label style="font-weight:900;">风格流派：</label>
        <input id="ed-genre" class="form-input" value="${b.genre}" />
        <label style="font-weight:900;">代表作品：</label>
        <input id="ed-works" class="form-input" value="${b.works}" />
        <label style="font-weight:900;">文献简介：</label>
        <textarea id="ed-desc" class="form-textarea" rows="3">${b.desc}</textarea>
        <label style="font-weight:900;">修改说明（记入版本历史）：</label>
        <input id="ed-note" class="form-input" placeholder="如：补充最新专辑" />
        <button class="zine-btn red" style="width:100%;" onclick="saveBandEdit('${b.id}')">💾 保存修订 (+10分)</button>
      `);
    }

    function saveBandEdit(bandId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      if (!b) return;
      b.year = document.getElementById("ed-year").value.trim() || b.year;
      b.genre = document.getElementById("ed-genre").value.trim() || b.genre;
      b.works = document.getElementById("ed-works").value.trim() || b.works;
      b.desc = document.getElementById("ed-desc").value.trim() || b.desc;
      const note = document.getElementById("ed-note").value.trim() || "完善词条信息";
      if (!b.history) b.history = [];
      b.history.unshift({
        user: appState.handle,
        time: "2026-10-25 " + new Date().toTimeString().slice(0, 5),
        note
      });
      addPoints(10, "修订乐队词条");
      closeModal();
      if (currentCityId) refreshDrawerBands(bandId);
    }

    function openHistoryModal(bandId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      if (!b) return;
      openModal(`📜 【${b.name}】版本历史`, `
        ${(b.history || []).map((h, i) => `
          <div style="background:#fff;padding:8px 10px;margin-bottom:6px;border:1.5px solid #141312;">
            <div style="font-weight:900;">v${b.history.length - i}.0 · ${h.user} (${h.time})</div>
            <div style="margin-top:3px;font-weight:700;color:var(--teal);">变更：${h.note}</div>
          </div>
        `).join("")}
      `);
    }

    function openClaimModal(bandId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      if (!b) return;
      openModal(`🎸 乐队官方认领：【${b.name}】`, `
        <p style="margin-bottom:8px;">乐队成员或厂牌主理人可提交认领，站长在后台审核通过后点亮「✓ 官方认证」：</p>
        <label style="font-weight:900;">身份/职务：</label>
        <input id="clm-role" class="form-input" placeholder="如：主唱 / 厂牌主理人" />
        <label style="font-weight:900;">联系方式：</label>
        <input id="clm-contact" class="form-input" placeholder="微信号/邮箱/微博" />
        <label style="font-weight:900;">补充说明：</label>
        <textarea id="clm-note" class="form-textarea" rows="2"></textarea>
        <button class="zine-btn red" style="width:100%;" onclick="submitBandClaim('${b.id}')">📨 提交认领申请</button>
      `);
    }

    function submitBandClaim(bandId) {
      const b = BANDS_DB.find(x => x.id === bandId);
      const role = document.getElementById("clm-role").value.trim() || "乐队成员";
      const contact = document.getElementById("clm-contact").value.trim() || "未留";
      const note = document.getElementById("clm-note").value.trim() || "申请官方认领";
      appState.modQueue.unshift({
        id: "M" + Date.now(),
        type: "CLAIM",
        bandId,
        bandName: b.name,
        applicant: `${appState.handle} (${role})`,
        contact,
        note,
        status: "PENDING",
        time: "2026-10-25"
      });
      saveState();
      closeModal();
      showToast("🎸 已提交给站长后台审核！");
    }

    // 站长私有审核后台（普通用户看不到，仅站长通过 ?admin=1 或搜索框输入 admin888 打开）
    document.getElementById("btn-secret-admin").addEventListener("click", renderModQueueModal);

    function renderModQueueModal() {
      const list = appState.modQueue || [];
      openModal("🔒 站长专属审核与管理后台 (仅你可见)", `
        <div style="background:#141312;color:#fef08a;padding:8px;margin-bottom:10px;font-weight:800;">
          💡 提示：此后台对普通访客完全隐藏。你可通过网址 <code>?admin=1</code> 或在搜索框输入暗号 <code>${ADMIN_SECRET}</code> 随时进入。
        </div>
        ${list.length === 0 ? `<p>当前无待审工单。</p>` : list.map(m => `
          <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="badge ${m.type === 'REPORT_POST' ? 'punk' : 'indie'}">${m.type === 'REPORT_POST' ? '⚠️ 举报下架' : '🎸 乐队认领'}</span>
              <span style="font-weight:900;color:${m.status === 'PENDING' ? 'var(--amber)' : 'var(--green)'};">${m.status}</span>
            </div>
            <div style="font-weight:900;margin-top:4px;">乐队：${m.bandName} | 申请人：${m.applicant}</div>
            <p style="font-size:11px;margin:4px 0;">内容：${m.note}</p>
            ${m.status === "PENDING" ? `
              <div style="display:flex;gap:6px;margin-top:6px;">
                <button class="zine-btn dark" style="height:26px;" onclick="resolveModItem('${m.id}', 'APPROVED')">✓ 批准 / 下架</button>
                <button class="zine-btn" style="height:26px;" onclick="resolveModItem('${m.id}', 'REJECTED')">✕ 驳回</button>
              </div>
            ` : ""}
          </div>
        `).join("")}
      `);
    }

    function resolveModItem(modId, decision) {
      const m = appState.modQueue.find(x => x.id === modId);
      if (!m) return;
      m.status = decision;
      if (decision === "APPROVED") {
        if (m.type === "CLAIM") {
          const b = BANDS_DB.find(x => x.id === m.bandId);
          if (b) {
            b.claimed = true;
            b.history.unshift({ user: "站长审核", time: "2026-10-25", note: "批准官方认领认证" });
          }
        } else if (m.type === "REPORT_POST") {
          const postArr = appState.posts[m.bandId] || [];
          const targetP = postArr.find(x => x.id === m.postId);
          if (targetP) targetP.hidden = true;
        }
      }
      saveState();
      renderModQueueModal();
      if (currentCityId) refreshDrawerBands(null);
    }

    document.getElementById("btn-open-profile").addEventListener("click", () => {
      const pts = appState.points || 120;
      const badges = [
        { name: "📻 地下听众", req: 50, desc: "进入中国摇滚声音地图" },
        { name: "🗂️ 地下档案员", req: 120, desc: "参与补录或收藏地下乐队" },
        { name: "🔍 现场勘误官", req: 150, desc: "参与词条修订与维护" },
        { name: "🧭 城市声学向导", req: 200, desc: "完成地标或路线打卡" },
        { name: "🎸 树村守夜人", req: 300, desc: "深度共创者最高荣誉勋章" }
      ];
      openModal("🏅 贡献者主页 & 徽章馆", `
        <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:10px;">
          <label style="font-weight:900;">你的花名代号：</label>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <input id="prof-handle" class="form-input" style="margin:0;" value="${appState.handle}" />
            <button class="zine-btn dark" onclick="appState.handle=document.getElementById('prof-handle').value.trim()||appState.handle;saveState();showToast('已保存')">保存</button>
          </div>
          <div style="margin-top:8px;font-weight:900;font-size:13px;">
            声望积分：<span style="color:var(--crimson);">${pts} 分</span> | 已打卡：${appState.checkins.length} 处
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${badges.map(bg => {
            const unlocked = pts >= bg.req;
            return `
              <div style="border:2px solid #141312;padding:8px;background:${unlocked ? '#fef08a' : '#e5e5e5'};opacity:${unlocked ? 1 : 0.6};">
                <div style="font-weight:900;font-size:12.5px;">${bg.name} ${unlocked ? "✓" : `(${bg.req}分)`}</div>
                <div style="font-size:10px;margin-top:2px;">${bg.desc}</div>
              </div>
            `;
          }).join("")}
        </div>
      `);
    });

    document.getElementById("btn-open-add").addEventListener("click", () => openAddBandModal(currentCityId || "beijing"));

    function openAddBandModal(defaultCityId = "beijing") {
      openModal("＋ 盖章补录新乐队档案", `
        <label style="font-weight:900;">所属城市：</label>
        <select id="add-city" class="form-select">
          ${Object.values(CITY_MAP).map(c => `<option value="${c.id}" ${c.id === defaultCityId ? "selected" : ""}>[${c.prov}] ${c.name}</option>`).join("")}
        </select>
        <label style="font-weight:900;">乐队名称*：</label>
        <input id="add-name" class="form-input" placeholder="输入乐队或音乐人名称..." />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <label style="font-weight:900;">成立年份：</label>
            <input id="add-year" class="form-input" value="2020" />
          </div>
          <div>
            <label style="font-weight:900;">风格流派：</label>
            <input id="add-genre" class="form-input" value="后朋克 / 独立摇滚" />
          </div>
        </div>
        <label style="font-weight:900;">代表作品：</label>
        <input id="add-works" class="form-input" placeholder="如：《立秋》《同名专辑》" />
        <label style="font-weight:900;">乐队简介：</label>
        <textarea id="add-desc" class="form-textarea" rows="3"></textarea>
        <button class="zine-btn red" style="width:100%;" onclick="confirmAddBand()">🔨 盖印收录入库 (+25分)</button>
      `);
    }

    function confirmAddBand() {
      const cid = document.getElementById("add-city").value;
      const name = document.getElementById("add-name").value.trim();
      if (!name) { showToast("请输入乐队名称"); return; }
      const cObj = CITY_MAP[cid];
      const newBand = {
        id: "B_USR_" + Date.now(),
        name,
        cityId: cid,
        cityName: cObj.name,
        prov: cObj.prov,
        year: document.getElementById("add-year").value.trim() || "2020",
        genre: document.getElementById("add-genre").value.trim() || "独立摇滚",
        works: document.getElementById("add-works").value.trim() || `《${name}》`,
        desc: document.getElementById("add-desc").value.trim() || `${cObj.prov}${cObj.name}独立摇滚乐队，由社区乐迷共创收录。`,
        claimed: false,
        history: [{ user: appState.handle, time: "2026-10-25", note: "首次补录建档" }]
      };
      BANDS_DB.unshift(newBand);
      cObj.bands.unshift(newBand);
      appState.customBands.push(newBand);
      addPoints(25, `补录【${name}】`);
      renderCityPins();
      closeModal();
      openCityDrawer(cid, newBand.id);
    }

    /********************************************************************
     * 9. 启动渲染
     ********************************************************************/
    renderBuiltinMap();
    renderCityPins();
    renderLandmarkPins();
    updateHeaderCounters();
  </script>
</body>
</html>
