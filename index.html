<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中国地下摇滚声音地图 · 文化年鉴与共创基建版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #e8e0cc;
            --paper-dark: #d8ceb5;
            --ink: #141311;
            --crimson: #c82318;
            --amber: #d97706;
            --teal: #0f766e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--paper); color: var(--ink);
            font-family: 'Space Mono', 'Noto Serif SC', monospace, serif;
            user-select: none;
        }
        .halftone-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background-image: radial-gradient(rgba(20, 19, 17, 0.08) 1px, transparent 0);
            background-size: 5px 5px;
        }
        .zine-box {
            background: var(--paper);
            border: 2.5px solid var(--ink);
            box-shadow: 4px 4px 0px var(--ink);
        }
        .zine-btn {
            background: var(--paper);
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0px var(--ink);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
            cursor: pointer;
        }
        .zine-btn:hover { background: #dfd5bc; }
        .zine-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--ink);
        }
        .zine-btn-red {
            background: var(--crimson); color: #fff;
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0px var(--ink);
        }
        .zine-btn-red:hover { background: #a81c12; }
        .band-card {
            background: #f3eee1;
            border: 2px solid var(--ink);
            box-shadow: 3px 3px 0px var(--ink);
            content-visibility: auto;
            contain-intrinsic-size: 210px;
        }
        @keyframes pulseHighlight {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200, 35, 24, 0.8), 3px 3px 0px var(--ink); border-color: var(--crimson); }
            50% { box-shadow: 0 0 0 8px rgba(200, 35, 24, 0), 3px 3px 0px var(--crimson); background-color: #fff3f0; }
        }
        .highlight-focus {
            animation: pulseHighlight 1s ease-in-out 3;
            border: 3px solid var(--crimson) !important;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--paper-dark); border-left: 1px solid var(--ink); }
        ::-webkit-scrollbar-thumb { background: var(--ink); }
        ::-webkit-scrollbar-thumb:hover { background: var(--crimson); }
    </style>
</head>
<body class="relative w-full h-full flex flex-col">

    <div class="halftone-bg"></div>

    <!-- 顶部主控台 Header -->
    <header class="relative z-40 w-full bg-[#e8e0cc]/95 border-b-[3px] border-[#141311] px-2.5 py-2 shadow-md">
        <div class="max-w-[1920px] mx-auto flex flex-col gap-2">
            <!-- 第一行：品牌 + 搜索 + 随机漫游 + 每日黄历 + 录入 -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <div class="bg-[#c82318] text-[#e8e0cc] font-black px-2 py-0.5 text-xs border-2 border-[#141311] tracking-widest">ARCHIVE 650+</div>
                    <h1 class="text-base sm:text-xl font-black tracking-tighter text-[#141311] uppercase">中国地下摇滚声音地图</h1>
                </div>

                <!-- 搜索栏（回车/点击按钮触发，z-index 99999） -->
                <div class="relative flex-1 max-w-md min-w-[210px]">
                    <div class="flex w-full">
                        <input id="searchInput" type="text" placeholder="搜乐队 / 城市 / 代表作 / 流派..." 
                            class="w-full px-2.5 py-1 text-xs sm:text-sm bg-[#f7f4eb] border-2 border-[#141311] focus:outline-none font-bold text-[#141311]" />
                        <button id="searchBtn" class="px-3 py-1 bg-[#141311] text-[#e8e0cc] text-xs font-black border-y-2 border-r-2 border-[#141311] hover:bg-[#c82318] transition-colors shrink-0">
                            搜索
                        </button>
                    </div>
                    <div id="searchDropdown" style="z-index: 99999;" class="hidden fixed sm:absolute left-2 right-2 sm:left-0 sm:right-0 mt-1 max-h-[65vh] overflow-y-auto bg-[#f7f4eb] border-[3px] border-[#141311] shadow-[6px_6px_0px_#141311]"></div>
                </div>

                <!-- 核心快捷动作组 -->
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button id="randomBandBtn" class="zine-btn bg-[#d97706] text-white px-2.5 py-1 text-xs font-black flex items-center gap-1" title="随机漫游全国任意一支乐队">
                        <span>🎲</span><span>随机发现</span>
                    </button>
                    <button id="dailyRecBtn" class="zine-btn px-2.5 py-1 text-xs font-black flex items-center gap-1">
                        <span>📅</span><span class="hidden sm:inline">今日声波</span>
                    </button>
                    <button id="openAddBandBtn" class="zine-btn zine-btn-red px-2.5 py-1 text-xs font-black flex items-center gap-1">
                        <span>＋</span><span>登记乐队</span>
                    </button>
                </div>
            </div>

            <!-- 第二行：文化基建功能矩阵工具栏 -->
            <div class="flex items-center justify-between gap-1.5 overflow-x-auto pb-0.5 pt-1 border-t border-[#141311]/20 text-xs">
                <div class="flex items-center gap-1.5 shrink-0">
                    <!-- 场景地标图层开关 -->
                    <button id="toggleLandmarksBtn" class="zine-btn px-2 py-0.5 font-black flex items-center gap-1 bg-[#141311] text-[#e8e0cc]">
                        <span>🏛️</span><span>历史地标/Livehouse: 开</span>
                    </button>
                    <!-- 朝圣路线 -->
                    <button id="openRoutesBtn" class="zine-btn px-2 py-0.5 font-black flex items-center gap-1">
                        <span>🚩</span><span>朝圣打卡路线</span>
                    </button>
                    <!-- 排行榜与冷门场景 -->
                    <button id="openRankBtn" class="zine-btn px-2 py-0.5 font-black flex items-center gap-1">
                        <span>📊</span><span>城市榜 & 冷门推荐</span>
                    </button>
                    <!-- 收藏夹 -->
                    <button id="openFavBtn" class="zine-btn px-2 py-0.5 font-black flex items-center gap-1">
                        <span>⭐</span><span>收藏/想去现场 (<span id="favCountBadge">0</span>)</span>
                    </button>
                    <!-- 清除足迹/路线连线 -->
                    <button id="clearLinesBtn" class="hidden zine-btn bg-[#c82318] text-white px-2 py-0.5 font-black items-center gap-1">
                        <span>✕</span><span>清除地图轨迹线</span>
                    </button>
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                    <!-- 审核队列 -->
                    <button id="openModBtn" class="zine-btn px-2 py-0.5 font-black flex items-center gap-1">
                        <span>🛡️</span><span>审核与认领 (<span id="modCountBadge">0</span>)</span>
                    </button>
                    <!-- 贡献者主页与徽章 -->
                    <button id="openProfileBtn" class="zine-btn bg-[#e0d4b8] px-2 py-0.5 font-black flex items-center gap-1">
                        <span>🏅</span><span id="navUserBadge">地下档案员</span><span>(<span id="navUserPts">120</span>分)</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体地图与浮动层 -->
    <main class="relative flex-1 w-full h-full overflow-hidden">
        <!-- ECharts 高性能矢量画布 -->
        <div id="chinaMapContainer" class="w-full h-full"></div>

        <!-- 地图加载状态提示 -->
        <div id="mapLoadingOverlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-[#e8e0cc]/90">
            <div class="zine-box p-6 max-w-sm text-center">
                <div class="text-lg font-black mb-1">正在展开中国地下声学版图...</div>
                <div class="text-xs font-bold text-[#555] mb-3">加载全国 34 省级行政区、70+ 摇滚重镇、650+ 乐队与历史地标</div>
                <div class="w-full h-3 border-2 border-[#141311] bg-[#f7f4eb] overflow-hidden">
                    <div id="loadingBar" class="h-full bg-[#c82318] w-2/3 transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- 当前激活的路线或乐队足迹横幅 -->
        <div id="activeTrackBanner" class="hidden absolute top-3 left-3 z-20 zine-box bg-[#141311] text-[#e8e0cc] px-3 py-2 max-w-xs sm:max-w-md">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <div id="trackBannerTag" class="text-[10px] font-black text-[#f59e0b] uppercase tracking-widest">PILGRIMAGE ROUTE</div>
                    <div id="trackBannerTitle" class="text-xs sm:text-sm font-black">路线名称</div>
                </div>
                <button onclick="clearActiveLines()" class="px-2 py-0.5 bg-[#c82318] text-white text-xs font-black border border-white">关闭轨迹</button>
            </div>
            <div id="trackBannerSteps" class="mt-1.5 text-[11px] text-[#d8ceb5] space-y-1 max-h-28 overflow-y-auto"></div>
        </div>

        <!-- 左下角图例与数据监控面板 -->
        <div class="absolute bottom-3 left-3 z-20 pointer-events-none hidden sm:block">
            <div class="zine-box p-2.5 bg-[#e8e0cc]/95 pointer-events-auto text-xs space-y-1">
                <div class="font-black border-b border-[#141311] pb-1 flex items-center justify-between gap-4">
                    <span>CHINA ROCK ZINE ATLAS</span>
                    <span class="bg-[#141311] text-[#e8e0cc] px-1 text-[10px]">60FPS</span>
                </div>
                <div class="flex items-center gap-3 pt-0.5">
                    <div>城市据点: <strong id="statCities" class="text-[#c82318]">0</strong></div>
                    <div>乐队大典: <strong id="statBands" class="text-[#c82318]">0</strong></div>
                    <div>历史地标: <strong id="statLandmarks" class="text-[#0f766e]">0</strong></div>
                </div>
                <div class="flex items-center gap-3 text-[11px] text-[#444] pt-0.5">
                    <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-[#c82318] border border-black"></span>摇滚重镇</span>
                    <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-[#141311] border border-white"></span>城市据点</span>
                    <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 bg-[#d97706] border border-black"></span>历史地标/Livehouse</span>
                </div>
            </div>
        </div>

        <!-- 城市/地标档案抽屉 (右侧滑出/移动端底部滑出) -->
        <aside id="cityDrawer" class="fixed sm:absolute bottom-0 right-0 sm:top-0 z-30 w-full sm:w-[480px] md:w-[540px] h-[82vh] sm:h-full bg-[#e8e0cc] border-t-[3px] sm:border-t-0 sm:border-l-[3px] border-[#141311] shadow-[-6px_0_0_rgba(20,19,17,0.9)] transform translate-y-full sm:translate-y-0 sm:translate-x-full transition-transform duration-200 flex flex-col">
            <!-- 抽屉头 -->
            <div class="p-3 bg-[#141311] text-[#e8e0cc] flex items-center justify-between shrink-0">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="drawerProvTag" class="bg-[#c82318] text-white text-[10px] font-black px-1.5 py-0.5 uppercase">PROVINCE</span>
                        <h2 id="drawerCityName" class="text-lg sm:text-xl font-black tracking-tight">城市名称</h2>
                        <span id="drawerBandCount" class="text-xs font-bold text-[#d8ceb5]">(0 支)</span>
                    </div>
                    <p id="drawerCityDesc" class="text-[11px] text-[#bbb] mt-0.5 line-clamp-1">城市摇滚场景历史注脚</p>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="drawerAddHereBtn" class="px-2 py-1 bg-[#c82318] text-white text-xs font-black border border-[#e8e0cc] hover:bg-red-700">
                        ＋在此添乐队
                    </button>
                    <button id="closeDrawerBtn" class="w-7 h-7 bg-[#e8e0cc] text-[#141311] font-black text-base flex items-center justify-center border border-[#141311]">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 城市内过滤器与该城地标切换 -->
            <div class="p-2 bg-[#d8ceb5] border-b-2 border-[#141311] flex flex-col gap-1.5 shrink-0">
                <div class="flex items-center gap-1.5">
                    <input id="drawerFilterInput" type="text" placeholder="在本城筛选乐队 / 风格 / 年代..." 
                        class="flex-1 px-2 py-1 text-xs bg-[#f7f4eb] border-2 border-[#141311] font-bold focus:outline-none" />
                    <select id="drawerGenreSelect" class="px-2 py-1 text-xs bg-[#f7f4eb] border-2 border-[#141311] font-black">
                        <option value="ALL">全部流派</option>
                        <option value="朋克">朋克 / 硬核</option>
                        <option value="金属">金属 / 重型</option>
                        <option value="后朋克">后朋克 / 新浪潮</option>
                        <option value="后摇">后摇 / 器乐</option>
                        <option value="独立">独立 / 另类</option>
                        <option value="民谣">根源 / 民谣摇滚</option>
                    </select>
                </div>
                <!-- 本城关联地标快捷栏 -->
                <div id="drawerCityLandmarks" class="hidden flex-wrap items-center gap-1 pt-0.5 text-[11px]"></div>
            </div>

            <!-- 虚拟分批渲染列表容器 -->
            <div id="drawerBandList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
        </aside>
    </main>

    <!-- ================= 弹窗矩阵 ================= -->

    <!-- 1. 通用多功能模态框 (用于展示地标详情、朝圣路线、排行榜、收藏夹、审核队列、版本历史、认领、个人主页) -->
    <div id="universalModal" class="hidden fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-2 sm:p-4">
        <div class="zine-box w-full max-w-2xl max-h-[88vh] flex flex-col bg-[#e8e0cc] overflow-hidden">
            <div class="p-3 bg-[#141311] text-[#e8e0cc] flex items-center justify-between shrink-0">
                <h3 id="uniModalTitle" class="text-base sm:text-lg font-black tracking-tight">模态框标题</h3>
                <button onclick="closeUniModal()" class="w-7 h-7 bg-[#c82318] text-white font-black text-sm border border-white">✕</button>
            </div>
            <div id="uniModalBody" class="p-3.5 overflow-y-auto space-y-3 text-xs sm:text-sm flex-1"></div>
        </div>
    </div>

    <!-- 2. 登记/编辑乐队弹窗 -->
    <div id="addBandModal" class="hidden fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-3">
        <div class="zine-box w-full max-w-md bg-[#e8e0cc] overflow-hidden">
            <div class="p-3 bg-[#141311] text-[#e8e0cc] flex items-center justify-between">
                <h3 id="bandFormTitle" class="text-base font-black">＋ 盖印归档地下乐队</h3>
                <button onclick="closeBandModal()" class="w-7 h-7 bg-[#c82318] text-white font-black">✕</button>
            </div>
            <form id="bandForm" class="p-4 space-y-3 text-xs">
                <input type="hidden" id="editBandId" value="" />
                <div>
                    <label class="block font-black mb-1">乐队名称 *</label>
                    <input id="formBandName" required type="text" placeholder="如：Lur: / 万能青年旅店" class="w-full px-2.5 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-black mb-1">所属城市据点 *</label>
                        <select id="formBandCity" class="w-full px-2 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold"></select>
                    </div>
                    <div>
                        <label class="block font-black mb-1">成立年份 *</label>
                        <input id="formBandYear" type="text" placeholder="如：1997年" value="2010年代" class="w-full px-2.5 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-black mb-1">音乐流派 *</label>
                        <input id="formBandGenre" required type="text" placeholder="如：后朋克 / 硬核朋克" class="w-full px-2.5 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                    <div>
                        <label class="block font-black mb-1">代表作 *</label>
                        <input id="formBandWorks" required type="text" placeholder="如：《杀死那个石家庄人》" class="w-full px-2.5 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                </div>
                <div>
                    <label class="block font-black mb-1">声音文献简评 / 重要足迹</label>
                    <textarea id="formBandDesc" rows="2" placeholder="记录乐队风格特征、排练地或重要首演现场..." class="w-full px-2.5 py-1.5 bg-[#f7f4eb] border-2 border-[#141311] font-bold"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block font-black mb-1">首演/常驻排练城市 (足迹连线)</label>
                        <input id="formBandFootprint" type="text" placeholder="如：北京,武汉,上海" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                    <div>
                        <label class="block font-black mb-1">编辑者署名</label>
                        <input id="formEditorName" type="text" placeholder="你的地下花名" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeBandModal()" class="zine-btn px-4 py-1.5 font-black">取消</button>
                    <button type="submit" class="zine-btn zine-btn-red px-5 py-1.5 font-black">盖章归档 (+15积分)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. 规范化图片上传与留言弹窗 (含来源、拍摄者、年份、授权协议) -->
    <div id="uploadMediaModal" class="hidden fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-3">
        <div class="zine-box w-full max-w-md bg-[#e8e0cc] overflow-hidden">
            <div class="p-3 bg-[#141311] text-[#e8e0cc] flex items-center justify-between">
                <h3 id="mediaModalBandTitle" class="text-sm sm:text-base font-black">📸 投递现场影像与留言</h3>
                <button onclick="closeMediaModal()" class="w-7 h-7 bg-[#c82318] text-white font-black">✕</button>
            </div>
            <form id="mediaForm" class="p-4 space-y-2.5 text-xs">
                <input type="hidden" id="mediaBandId" />
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-black mb-1">你的花名 / 拍摄者署名 *</label>
                        <input id="mediaAuthor" required type="text" placeholder="如：树村老炮" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                    <div>
                        <label class="block font-black mb-1">拍摄/现场年份 *</label>
                        <input id="mediaYear" required type="text" value="2024" placeholder="如：2005年" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold" />
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-black mb-1">图片来源说明 *</label>
                        <select id="mediaSource" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold">
                            <option value="本人现场实拍">本人现场实拍</option>
                            <option value="实体门票/卡带扫描">实体门票/卡带扫描</option>
                            <option value="主办方/乐队公开海报">主办方/乐队公开海报</option>
                            <option value="历史文献归档">历史文献归档</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-black mb-1">版权授权协议 *</label>
                        <select id="mediaLicense" class="w-full px-2 py-1 bg-[#f7f4eb] border-2 border-[#141311] font-bold">
                            <option value="CC BY-NC-SA 4.0 (署名-非商用)">CC BY-NC-SA 4.0</option>
                            <option value="CC0 公共领域贡献">CC0 公共领域</option>
                            <option value="仅限本档案站内展示">仅限站内档案展示</option>
                        </select>
                    </div>
                </div>
                <div>
