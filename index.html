<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>中国地下摇滚声音地图 · 1380+真实乐队与高精度丝网版画版</title>
  <!-- 国内极速CDN加载 ECharts 与官方标准高精度中国地图矢量库 (含台湾、港澳、南海诸岛完整测绘边界) -->
  <script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
  <script src="https://cdn.staticfile.org/echarts/4.9.0/map/js/china.js"></script>
  <style>
    :root {
      --paper: #eae1ce;
      --paper-dark: #dcd0b6;
      --ink: #141312;
      --crimson: #c92a2a;
      --amber: #d97706;
      --teal: #0f766e;
      --green: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", monospace, sans-serif;
      user-select: none;
    }
    /* 地下复印机网点与旧纸纤维纹理层 */
    .zine-texture {
      position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: 0.16;
      background-image:
        radial-gradient(var(--ink) 0.85px, transparent 0.85px),
        radial-gradient(#8c7a5b 0.6px, transparent 0.6px);
      background-size: 10px 10px, 23px 23px;
      background-position: 0 0, 5px 5px;
    }
    .vignette-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 19;
      box-shadow: inset 0 0 90px rgba(20, 19, 18, 0.35);
    }

    /* 顶部总控台 */
    #top-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--paper); border-bottom: 3px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink); padding: 6px 10px;
    }
    .header-row-1 {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px;
    }
    .brand-box { display: flex; align-items: center; gap: 6px; }
    .brand-stamp {
      background: var(--crimson); color: #fff; font-weight: 900; font-size: 11px;
      padding: 2px 6px; border: 2px solid var(--ink); transform: rotate(-2deg);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .brand-title { font-size: 16px; font-weight: 900; letter-spacing: -0.5px; }
    .search-bar-wrap {
      position: relative; flex: 1; min-width: 210px; max-width: 520px; display: flex; gap: 4px;
    }
    #search-input {
      flex: 1; height: 32px; padding: 0 8px; font-size: 12px; font-weight: 800;
      background: #fff; border: 2px solid var(--ink); color: var(--ink); outline: none;
    }
    #search-input:focus { background: #fff9db; }
    .zine-btn {
      height: 32px; padding: 0 8px; font-size: 11px; font-weight: 900;
      border: 2px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink); cursor: pointer; display: inline-flex;
      align-items: center; gap: 3px; white-space: nowrap; transition: transform 0.08s;
    }
    .zine-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .zine-btn.red { background: var(--crimson); color: #fff; }
    .zine-btn.dark { background: var(--ink); color: var(--paper); }
    .zine-btn.amber { background: #fef08a; color: var(--ink); }

    .header-row-2 {
      display: flex; align-items: center; gap: 5px; overflow-x: auto;
      padding-top: 5px; margin-top: 5px; border-top: 1.5px dashed rgba(20,19,18,0.3);
      scrollbar-width: none;
    }
    .header-row-2::-webkit-scrollbar { display: none; }
    .sm-btn {
      height: 25px; padding: 0 7px; font-size: 11px; font-weight: 800;
      border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
      box-shadow: 1.5px 1.5px 0 var(--ink); cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .sm-btn.active { background: var(--crimson); color: #fff; }

    /* 搜索结果最高层级下拉框 */
    #search-dropdown {
      position: fixed; z-index: 99999; display: none;
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink); max-height: 64vh; overflow-y: auto;
      width: min(94vw, 480px);
    }
    .search-item {
      padding: 8px 10px; border-bottom: 1.5px dashed rgba(20,19,18,0.25);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.85);
    }
    .search-item:hover { background: #fef08a; }

    /* 高精度中国地图画布 */
    #map-container {
      position: fixed; inset: 0; top: 76px; z-index: 5;
      background: radial-gradient(circle at 50% 48%, #f3ecdc 0%, #dfd3b8 70%, #cbbba0 100%);
    }

    /* 左下角复古印刷铭牌与图例 */
    #zine-compass {
      position: fixed; left: 12px; bottom: 14px; z-index: 400;
      background: rgba(234, 225, 206, 0.94); border: 2.5px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink); padding: 8px 10px; font-size: 11px;
      max-width: 250px;
    }
    /* 右下角复位与缩放按钮 */
    #map-zoom-box {
      position: fixed; right: 12px; bottom: 14px; z-index: 400;
      display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }

    /* 轨迹/路线激活顶部提示条 */
    #trace-banner {
      position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
      z-index: 800; display: none; background: var(--ink); color: #fef08a;
      border: 2px solid #fef08a; box-shadow: 4px 4px 0 var(--crimson);
      padding: 6px 12px; font-size: 12px; font-weight: 800;
      align-items: center; gap: 10px; max-width: 94vw;
    }

    /* 城市抽屉面板 */
    #city-drawer {
      position: fixed; top: 76px; right: 0; bottom: 0;
      width: min(100vw, 530px); background: var(--paper);
      border-left: 4px solid var(--ink); box-shadow: -6px 0 0 rgba(20,19,18,0.92);
      z-index: 1200; transform: translateX(105%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
    }
    #city-drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 10px 12px; background: var(--paper-dark);
      border-bottom: 3px solid var(--ink);
    }
    .drawer-filter-bar {
      padding: 6px 12px; background: #e5dcc6; border-bottom: 2px solid var(--ink);
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    #drawer-list {
      flex: 1; overflow-y: auto; padding: 10px 12px 60px;
      -webkit-overflow-scrolling: touch;
    }

    /* 乐队文献卡片 */
    .band-card {
      background: rgba(255,255,255,0.92); border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); padding: 10px; margin-bottom: 10px;
      transition: background-color 0.2s;
    }
    .band-card.flash {
      animation: cardFlash 0.65s ease-in-out 4;
    }
    @keyframes cardFlash {
      0%, 100% { background: rgba(255,255,255,0.92); border-color: var(--ink); }
      50% { background: #fef08a; border-color: var(--crimson); transform: scale(1.01); }
    }
    .badge {
      display: inline-block; padding: 1px 5px; font-size: 10px; font-weight: 800;
      border: 1px solid var(--ink); margin-right: 4px;
    }
    .badge.punk { background: var(--crimson); color: #fff; }
    .badge.metal { background: var(--ink); color: #fef08a; }
    .badge.indie { background: #0f766e; color: #fff; }
    .badge.folk { background: #b45309; color: #fff; }
    .stream-links {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px;
      padding-top: 6px; border-top: 1px dashed rgba(20,19,18,0.25);
    }
    .stream-a {
      font-size: 10px; font-weight: 800; padding: 2px 6px;
      border: 1px solid var(--ink); text-decoration: none; color: var(--ink);
      background: #fff;
    }
    .stream-a.wy { background: #fee2e2; color: #991b1b; }
    .stream-a.qq { background: #dcfce7; color: #166534; }
    .stream-a.bl { background: #e0f2fe; color: #075985; }
    .stream-a.yt { background: #f3f4f6; color: #1f2937; }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .act-btn {
      font-size: 10px; font-weight: 800; padding: 2px 6px;
      border: 1px solid var(--ink); background: var(--paper); cursor: pointer;
    }
    .act-btn:hover { background: #fef08a; }

    /* 通用模态弹窗 */
    .modal-mask {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(15,15,15,0.72); display: none;
      align-items: center; justify-content: center; padding: 12px;
    }
    .modal-box {
      background: var(--paper); border: 3px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink); width: 100%; max-width: 560px;
      max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      padding: 10px 12px; background: var(--ink); color: var(--paper);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 900; font-size: 14px;
    }
    .modal-body {
      padding: 12px; overflow-y: auto; flex: 1; font-size: 12px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 6px 8px; font-size: 12px; font-weight: 700;
      border: 2px solid var(--ink); background: #fff; margin-top: 3px; margin-bottom: 8px;
    }
    #toast-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 99999; background: var(--ink); color: #fef08a;
      border: 2px solid #fff; box-shadow: 4px 4px 0 var(--crimson);
      padding: 7px 14px; font-size: 12px; font-weight: 900; display: none;
    }
    @media (max-width: 640px) {
      .brand-title { font-size: 14px; }
      #map-container { top: 82px; }
      #zine-compass { max-width: 185px; padding: 5px 7px; font-size: 10px; }
      #city-drawer { top: auto; height: 82vh; width: 100vw; border-left: none; border-top: 4px solid var(--ink); transform: translateY(105%); }
      #city-drawer.open { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="zine-texture"></div>
  <div class="vignette-overlay"></div>

  <!-- 顶部主控台 -->
  <header id="top-header">
    <div class="header-row-1">
      <div class="brand-box">
        <span class="brand-stamp">ROCK ATLAS</span>
        <h1 class="brand-title">中国摇滚声音地图</h1>
        <span id="top-count-tag" style="font-size:10px;font-weight:900;background:#141312;color:#fef08a;padding:1px 5px;">1380+ 乐队</span>
      </div>

      <div class="search-bar-wrap" id="search-wrap">
        <input id="search-input" type="text" placeholder="搜乐队 / 城市 / 代表作 (如: 孤独的利里 / Lur / 万青 / 蛙池)..." autocomplete="off" />
        <button class="zine-btn dark" id="btn-do-search">搜索</button>
        <button class="zine-btn amber" id="btn-random-band">🎲 随机发现</button>
        <button class="zine-btn red" id="btn-open-add">＋ 补录乐队</button>
      </div>
    </div>

    <!-- 第二排：11大摇滚基建功能栏 -->
    <div class="header-row-2">
      <button class="sm-btn" id="btn-daily-rec">📅 今日声波推荐</button>
      <button class="sm-btn active" id="btn-toggle-landmarks">🏛️ 场景地标图层 (开)</button>
      <button class="sm-btn" id="btn-open-routes">🚩 朝圣打卡路线</button>
      <button class="sm-btn" id="btn-open-rank">📊 城市榜 & 冷门特集</button>
      <button class="sm-btn" id="btn-open-favs">⭐ 收藏/想去现场 (<span id="fav-num">0</span>)</button>
      <button class="sm-btn" id="btn-open-mod">🛡️ 审核队列 & 认领 (<span id="mod-num">0</span>)</button>
      <button class="sm-btn" id="btn-open-profile">🏅 贡献者徽章 (<span id="pts-num">120</span>分)</button>

  </header>

  <!-- 搜索结果置顶下拉层 -->
  <div id="search-dropdown"></div>

  <!-- 路线/足迹激活横幅 -->
  <div id="trace-banner">

  </div>

  <!-- 测绘级高精度丝网版画中国地图主容器 -->
  <main id="map-container"></main>

  <!-- 左下角丝网版画图例铭牌 -->
  <div id="zine-compass">

    <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;">

    </div>
    <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;">
      <span style="display:inline-block;width:10px;height:10px;background:#fef08a;border:1.5px solid #141312;transform:rotate(45deg);"></span>
      <span>历史地标 (树村/迷笛/Livehouse/打口店)</span>
    </div>
    <div style="font-size:10px;opacity:0.8;margin-top:3px;">
      收录：<strong id="stat-city-cnt">82</strong> 城 | <strong id="stat-band-cnt" style="color:var(--crimson);">1380+</strong> 支真实乐队
    </div>
  </div>

  <!-- 右下角复位控件 -->
  <div id="map-zoom-box">
    <button class="zine-btn dark" onclick="resetChinaMap()">🗺️ 复位全国全境视野</button>
  </div>

  <!-- 城市乐队文献抽屉 -->
  <aside id="city-drawer">
    <div class="drawer-head">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <span id="drw-prov" class="brand-stamp" style="display:inline-block;margin-bottom:3px;">省份</span>
          <h2 id="drw-city" style="font-size:20px;font-weight:900;">城市名称</h2>
        </div>
        <div style="display:flex;gap:5px;">
          <button class="zine-btn red" id="btn-drw-add" style="height:28px;font-size:11px;">＋ 在此城加乐队</button>

      <button class="sm-btn" data-gf="后朋" onclick="filterDrawerGenre('后朋')">后朋/冷潮</button>

      <button class="sm-btn" data-gf="独立" onclick="filterDrawerGenre('独立')">独立/迷幻</button>
      <button class="sm-btn" data-gf="民谣" onclick="filterDrawerGenre('民谣')">根源/民谣</button>
    </div>

    <div id="drawer-list"></div>
  </aside>

  <!-- 通用模态弹窗 -->
  <div class="modal-mask" id="main-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">窗口标题</span>
        <button class="zine-btn red" style="height:24px;padding:0 6px;" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-box"></div>

  <script>
    /********************************************************************

      handle: "地下乐迷#" + Math.floor(1000 + Math.random() * 9000),
      points: 120,
      favBands: [],
      favLandmarks: [],
      checkins: [],
      customBands: [],
      posts: {},
      modQueue: [
        { id: "M_INIT_1", type: "CLAIM", bandId: "B1", bandName: "孤独的利里", applicant: "乐队档案组", contact: "band@rockzine.cn", note: "申请点亮【孤独的利里】官方认证入驻徽章", status: "PENDING", time: "2026-10-25" }
      ],
      showLandmarks: true
    };

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) appState = { ...appState, ...JSON.parse(saved) };
    } catch (e) {}

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
      updateHeaderCounters();
    }

    if (Array.isArray(appState.customBands)) {
      appState.customBands.forEach(cb => {
        if (!SEEN_NAMES.has(cb.name.toLowerCase()) && CITY_MAP[cb.cityId]) {
          SEEN_NAMES.add(cb.name.toLowerCase());
          BANDS_DB.unshift(cb);
          CITY_MAP[cb.cityId].bands.unshift(cb);
        }
      });
    }

    function addPoints(pts, reason) {
      appState.points = (appState.points || 120) + pts;
      saveState();
      showToast(`🏅 ${reason} (+${pts} 声望积分)`);
    }

    function updateHeaderCounters() {
      document.getElementById("fav-num").textContent = (appState.favBands.length + appState.favLandmarks.length);
      document.getElementById("mod-num").textContent = (appState.modQueue || []).filter(m => m.status === "PENDING").length;
      document.getElementById("pts-num").textContent = appState.points || 120;
      document.getElementById("stat-city-cnt").textContent = Object.keys(CITY_MAP).length;
      document.getElementById("stat-band-cnt").textContent = BANDS_DB.length;
      document.getElementById("top-count-tag").textContent = BANDS_DB.length + " 支乐队";
    }

    /********************************************************************
     * 4. ECharts 测绘级高精度中国地图 + 复古丝网版画定制渲染引擎
     ********************************************************************/
    let chart = null;
    let activeTraceLines = [];
    let activeTraceNodes = [];

    function buildCityScatterData() {
      return Object.values(CITY_MAP).map(c => ({
        name: c.name,
        cityId: c.id,
        prov: c.prov,
        value: [c.lng, c.lat, c.bands.length]
      }));
    }

    function buildLandmarkScatterData() {
      if (!appState.showLandmarks) return [];
      return LANDMARKS_DATA.map(lm => ({
        name: lm.name,
        lmId: lm.id,
        type: lm.type,
        value: [lm.lng, lm.lat, 1]
      }));
    }

    function renderEChartsMap(center = null, zoom = null) {
      if (!chart) {
        chart = echarts.init(document.getElementById("map-container"), null, { renderer: "canvas" });
        window.addEventListener("resize", () => chart && chart.resize());

        chart.on("click", params => {
          if (params.seriesName === "摇滚城市" && params.data && params.data.cityId) {
            openCityDrawer(params.data.cityId);
          } else if (params.seriesName === "历史地标" && params.data && params.data.lmId) {
            openLandmarkDetail(params.data.lmId);
          } else if (params.componentType === "geo" && params.name) {
            // 点击任意省份板块，直接打开该省代表性摇滚城市
            const cid = PROV_TO_CITY[params.name];
            if (cid) openCityDrawer(cid);
          }
        });
      }

      const cityData = buildCityScatterData();
      const topCities = [...cityData].sort((a, b) => b.value[2] - a.value[2]).slice(0, 14);
      const lmData = buildLandmarkScatterData();

      const option = {
        backgroundColor: "transparent",
        tooltip: {
          trigger: "item",
          backgroundColor: "#141312",
          borderColor: "#fef08a",
          borderWidth: 2,
          textStyle: { color: "#fef08a", fontSize: 12, fontWeight: "bold" },
          formatter: p => {
            if (p.seriesName === "摇滚城市") {
              return `🎸 【${p.data.prov}·${p.name}】<br/>收录摇滚乐队：<span style="color:#ff6b6b;font-size:14px;">${p.value[2]}</span> 支<br/><span style="color:#ccc;font-size:10px;">点击打开该城地下乐队传单</span>`;
            }
            if (p.seriesName === "历史地标") {
              return `🏛️ 【${p.name}】(${p.data.type})<br/><span style="color:#ccc;font-size:10px;">点击查看历史文献与打卡</span>`;
            }
            return `📍 ${p.name}（点击查看本省摇滚档案）`;
          }
        },
        geo: {
          map: "china",
          roam: true,
          zoom: zoom || (window.innerWidth < 640 ? 1.25 : 1.18),
          center: center || [105.5, 36.2],
          scaleLimit: { min: 0.75, max: 14 },
          label: {
            show: true,
            color: "#3b352c",
            fontSize: window.innerWidth < 640 ? 9 : 10.5,
            fontWeight: "bold"
          },
          itemStyle: {
            areaColor: "#dfd3b8",
            borderColor: "#141312",
            borderWidth: 1.3,
            shadowColor: "#c92a2a",
            shadowOffsetX: 2.5,
            shadowOffsetY: 2.5,
            shadowBlur: 0
          },
          emphasis: {
            label: { color: "#141312", fontWeight: "900", fontSize: 12 },
            itemStyle: {
              areaColor: "#f3dca2",
              borderColor: "#c92a2a",
              borderWidth: 2.2,
              shadowColor: "#141312",
              shadowOffsetX: 3,
              shadowOffsetY: 3
            }
          }
        },
        series: [
          // 1. 全国82城火漆印章点
          {
            name: "摇滚城市",
            type: "scatter",
            coordinateSystem: "geo",
            data: cityData,
            symbolSize: val => Math.min(26, Math.max(9, 7 + Math.sqrt(val[2]) * 2.2)),
            label: {
              show: true,
              formatter: p => p.value[2] >= 12 ? `${p.name}(${p.value[2]})` : p.name,
              position: "top",
              color: "#141312",
              fontSize: 10,
              fontWeight: "900",
              backgroundColor: "rgba(234,225,206,0.85)",
              borderColor: "#141312",
              borderWidth: 1,
              padding: [1, 3]
            },
            itemStyle: {
              color: p => p.value[2] >= 20 ? "#c92a2a" : (p.value[2] >= 10 ? "#d97706" : "#141312"),
              borderColor: "#fff",
              borderWidth: 1.5,
              shadowColor: "#141312",
              shadowOffsetX: 1.5,
              shadowOffsetY: 1.5
            }
          },
          // 2. 核心摇滚重镇脉冲波纹
          {
            name: "摇滚城市",
            type: "effectScatter",
            coordinateSystem: "geo",
            data: topCities,
            symbolSize: val => Math.min(28, 10 + Math.sqrt(val[2]) * 2.2),
            showEffectOn: "render",
            rippleEffect: { brushType: "stroke", scale: 2.8, period: 4 },
            itemStyle: { color: "#c92a2a", shadowBlur: 4, shadowColor: "#c92a2a" },
            zlevel: 2
          },
          // 3. 历史场景地标图层（菱形黄印）
          {
            name: "历史地标",
            type: "scatter",
            coordinateSystem: "geo",
            symbol: "diamond",
            symbolSize: 14,
            data: lmData,
            label: {
              show: true,
              formatter: p => "★" + (p.name.split("·")[1] || p.name),
              position: "bottom",
              color: "#7c2d12",
              fontSize: 9.5,
              fontWeight: "900",
              backgroundColor: "#fef08a",
              borderColor: "#141312",
              borderWidth: 1,
              padding: [1, 3]
            },
            itemStyle: {
              color: "#fef08a",
              borderColor: "#141312",
              borderWidth: 1.8
            },
            zlevel: 3
          },
          // 4. 朝圣路线与乐队足迹连线图层
          {
            name: "轨迹连线",
            type: "lines",
            coordinateSystem: "geo",
            zlevel: 5,
            effect: {
              show: true,
              period: 4,
              trailLength: 0.25,
              symbol: "arrow",
              symbolSize: 7,
              color: "#fef08a"
            },
            lineStyle: {
              color: "#c92a2a",
              width: 3,
              type: "dashed",
              curveness: 0.18,
              opacity: 0.92
            },
            data: activeTraceLines
          },
          // 5. 轨迹节点标注
          {
            name: "轨迹节点",
            type: "scatter",
            coordinateSystem: "geo",
            zlevel: 6,
            symbolSize: 14,
            label: {
              show: true,
              formatter: p => p.name,
              position: "top",
              color: "#fef08a",
              backgroundColor: "#c92a2a",
              borderColor: "#141312",
              borderWidth: 1.5,
              padding: [2, 5],
              fontSize: 10.5,
              fontWeight: "900"
            },
            itemStyle: { color: "#fef08a", borderColor: "#c92a2a", borderWidth: 2.5 },
            data: activeTraceNodes
          }
        ]
      };

      chart.setOption(option, true);
    }

    function resetChinaMap() {
      activeTraceLines = [];
      activeTraceNodes = [];
      document.getElementById("trace-banner").style.display = "none";
      renderEChartsMap([105.5, 36.2], window.innerWidth < 640 ? 1.25 : 1.18);
    }

    function flyToCity(lng, lat, zoom = 4.2) {
      if (!chart) return;
      chart.setOption({ geo: { center: [lng, lat], zoom } });
    }

    /********************************************************************
     * 5. 城市抽屉与虚拟分批渲染列表 (零卡顿)
     ********************************************************************/
    let currentCityId = null;
    let currentGenreFilter = "ALL";
    let currentFilteredBands = [];
    let renderedCount = 0;
    const BATCH_SIZE = 25;
    const drawerEl = document.getElementById("city-drawer");
    const drawerListEl = document.getElementById("drawer-list");

    function openCityDrawer(cityId, highlightBandId = null) {
      const c = CITY_MAP[cityId];
      if (!c) return;
      currentCityId = cityId;
      currentGenreFilter = "ALL";
      document.querySelectorAll("#city-drawer [data-gf]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-gf") === "ALL");
      });

      document.getElementById("drw-prov").textContent = c.prov + " · 摇滚档案袋";
      document.getElementById("drw-city").textContent = c.name;
      document.getElementById("drw-desc").textContent = c.desc;
      document.getElementById("btn-drw-add").onclick = () => openAddBandModal(cityId);

      flyToCity(c.lng, c.lat, 4.0);
      drawerEl.classList.add("open");
      refreshDrawerBands(highlightBandId);
    }

    function closeCityDrawer() { drawerEl.classList.remove("open"); }

    function filterDrawerGenre(gf) {
      currentGenreFilter = gf;
      document.querySelectorAll("#city-drawer [data-gf]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-gf") === gf);
      });
      refreshDrawerBands(null);
    }

    function refreshDrawerBands(highlightBandId = null) {
      const c = CITY_MAP[currentCityId];
      if (!c) return;
      currentFilteredBands = c.bands.filter(b => {
        if (currentGenreFilter === "ALL") return true;
        return b.genre.includes(currentGenreFilter);
      });

      let minRender = BATCH_SIZE;
      if (highlightBandId) {
        const idx = currentFilteredBands.findIndex(b => b.id === highlightBandId);
        if (idx >= 0) minRender = Math.max(BATCH_SIZE, idx + 5);
      }

      document.getElementById("drw-count").textContent = currentFilteredBands.length;
      drawerListEl.innerHTML = "";
      renderedCount = 0;
      appendDrawerBatch(minRender);

      if (highlightBandId) {
        setTimeout(() => {
          const card = document.getElementById("card-" + highlightBandId);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.add("flash");
            setTimeout(() => card.classList.remove("flash"), 2800);
          }
        }, 120);
      }
    }

    function getGenreBadgeClass(genre) {
      if (genre.includes("朋克") || genre.includes("硬核")) return "punk";
      if (genre.includes("金属") || genre.includes("核")) return "metal";
      if (genre.includes("民谣")) return "folk";
      return "indie";
    }

    function renderBandCardHtml(b) {
      const isFav = appState.favBands.includes(b.id);
      const posts = (appState.posts[b.id] || []).filter(p => !p.hidden);
      const q = encodeURIComponent(b.name.replace(/\(.*\)/g, ""));
      return `
        <article class="band-card" id="card-${b.id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
            <div>
              <span class="badge ${getGenreBadgeClass(b.genre)}">${b.genre}</span>
              <span class="badge" style="background:#eee;">${b.year}</span>
              ${b.claimed ? `<span class="badge" style="background:#15803d;color:#fff;">✓ 官方认证入驻</span>` : ""}
              <h3 style="font-size:16px;font-weight:900;margin-top:3px;">${b.name}</h3>
            </div>
            <button class="act-btn" onclick="toggleFavBand('${b.id}')" style="font-size:12px;background:${isFav ? '#fef08a' : '#fff'};">
              ${isFav ? "★ 已想看" : "☆ 想去现场"}
            </button>
          </div>

          <div style="margin-top:5px;font-size:11px;font-weight:800;color:var(--crimson);">
            代表作：${b.works}
          </div>
          <p style="margin-top:4px;font-size:11px;line-height:1.45;color:#2b2927;">${b.desc}</p>

          <div class="stream-links">
            <span style="font-size:10px;font-weight:900;align-self:center;">🎧 版权试听：</span>
            <a class="stream-a wy" href="https://music.163.com/#/search/m/?s=${q}" target="_blank" rel="noopener">网易云音乐 ↗</a>
            <a class="stream-a qq" href="https://y.qq.com/n/ryqq/search?w=${q}" target="_blank" rel="noopener">QQ音乐 ↗</a>
            <a class="stream-a bl" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(b.name + ' 现场 Live')}" target="_blank" rel="noopener">B站现场 ↗</a>
            <a class="stream-a yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube ↗</a>
          </div>

          <div class="card-actions">
            <button class="act-btn" onclick="showBandFootprint('${b.id}')">🕸️ 乐队足迹连线</button>
            <button class="act-btn" onclick="openBandPostsModal('${b.id}')">📸 返图/留言 (${posts.length})</button>
            <button class="act-btn" onclick="openEditBandModal('${b.id}')">✏️ 勘误编辑</button>
            <button class="act-btn" onclick="openHistoryModal('${b.id}')">📜 版本历史 (${(b.history || []).length})</button>
            <button class="act-btn" onclick="openClaimModal('${b.id}')">🎸 乐队认领</button>
          </div>
        </article>
      `;
    }

    function appendDrawerBatch(count = BATCH_SIZE) {
      if (renderedCount >= currentFilteredBands.length) return;
      const slice = currentFilteredBands.slice(renderedCount, renderedCount + count);
      renderedCount += slice.length;
      const temp = document.createElement("div");
      temp.innerHTML = slice.map(renderBandCardHtml).join("");
      while (temp.firstChild) drawerListEl.appendChild(temp.firstChild);
    }

    drawerListEl.addEventListener("scroll", () => {
      if (drawerListEl.scrollTop + drawerListEl.clientHeight >= drawerListEl.scrollHeight - 180) {
        appendDrawerBatch(BATCH_SIZE);
      }
    });

    /********************************************************************
     * 6. 搜索系统（按回车或点按钮触发，z-index:99999 绝不遮挡）
     ********************************************************************/
    const searchInput = document.getElementById("search-input");
    const searchDropdown = document.getElementById("search-dropdown");

    function executeSearch() {
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) { searchDropdown.style.display = "none"; return; }
      const rect = document.getElementById("search-wrap").getBoundingClientRect();
      searchDropdown.style.top = (rect.bottom + 4) + "px";
      searchDropdown.style.left = Math.max(8, rect.left) + "px";

      const matched = BANDS_DB.filter(b =>
        b.name.toLowerCase().includes(kw) ||
        b.cityName.toLowerCase().includes(kw) ||
        b.prov.toLowerCase().includes(kw) ||
        b.works.toLowerCase().includes(kw) ||
        b.genre.toLowerCase().includes(kw)
      ).slice(0, 40);

      if (matched.length === 0) {
        searchDropdown.innerHTML = `
          <div style="padding:12px;font-size:12px;font-weight:800;">
            未找到“${searchInput.value}”相关乐队。
            <button class="zine-btn red" style="margin-left:8px;height:26px;" onclick="searchDropdown.style.display='none';openAddBandModal()">＋ 立即补录该乐队</button>
          </div>
        `;
      } else {
        searchDropdown.innerHTML = `
          <div style="padding:6px 10px;background:#141312;color:#fef08a;font-size:11px;font-weight:900;display:flex;justify-content:space-between;">
            <span>找到 ${matched.length} 条匹配档案（点击直达）</span>
            <span style="cursor:pointer;" onclick="searchDropdown.style.display='none'">✕ 关闭</span>
          </div>
          ${matched.map(b => `
            <div class="search-item" onclick="selectSearchResult('${b.cityId}', '${b.id}')">
              <div>
                <div style="font-size:13px;font-weight:900;">${b.name} <span style="font-size:10px;color:var(--crimson);">[${b.prov}·${b.cityName}]</span></div>
                <div style="font-size:10px;opacity:0.75;">${b.year} · ${b.genre} · ${b.works}</div>
              </div>
              <span style="font-size:11px;font-weight:900;color:var(--crimson);">定位 ➔</span>
            </div>
          `).join("")}
        `;
      }
      searchDropdown.style.display = "block";
    }

    function selectSearchResult(cityId, bandId) {
      searchDropdown.style.display = "none";
      openCityDrawer(cityId, bandId);
    }

    document.getElementById("btn-do-search").addEventListener("click", executeSearch);
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); executeSearch(); }
    });
    document.addEventListener("click", e => {
      if (!e.target.closest("#search-wrap") && !e.target.closest("#search-dropdown")) {
        searchDropdown.style.display = "none";
      }
    });

    /********************************************************************
     * 7. 11大摇滚基建功能弹窗与连线逻辑
     ********************************************************************/
    const mainModal = document.getElementById("main-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      mainModal.style.display = "flex";
    }
    function closeModal() { mainModal.style.display = "none"; }

    function showToast(msg) {
      const t = document.getElementById("toast-box");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
    }

    // 1) 随机发现一支乐队
    document.getElementById("btn-random-band").addEventListener("click", () => {
      const rand = BANDS_DB[Math.floor(Math.random() * BANDS_DB.length)];
      showToast(`🎲 随机盲盒命中：【${rand.cityName}】${rand.name}`);
      openCityDrawer(rand.cityId, rand.id);
    });

    // 2) 365天今日声波推荐弹窗
    document.getElementById("btn-daily-rec").addEventListener("click", () => {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const dateStr = `${now.getFullYear()}年${m}月${d}日`;
      const FEST_MAP = {
        "1-1": "元旦新声 · 新年第一声失真",
        "2-14": "情人节 · 秘密的爱与浪漫噪音",
        "4-5": "清明 · 涅槃与追思",
        "5-1": "五一劳动节 · 劳动之余与迷笛纪念",
        "5-4": "五四青年节 · 新长征路上的摇滚",
        "5-9": "1986崔健首唱《一无所有》纪念日",
        "6-30": "黄家驹纪念日 · 海阔天空不灭摇滚魂",
        "10-24": "深秋霜降 · 立秋之后与北方平原",
        "10-25": "十月深秋声波日 · 山海回响与后朋克之夜",
        "12-17": "1994香港红磡摇滚中国乐势力纪念日"
      };
      const festTitle = FEST_MAP[`${m}-${d}`] || `深秋摇滚声波黄历 · 每日3首精选`;
      const seed = now.getFullYear() * 10000 + m * 100 + d;
      const picks = [
        BANDS_DB[seed % 40],
        BANDS_DB[(seed * 7 + 11) % 90],
        BANDS_DB[(seed * 13 + 23) % 150]
      ];
      openModal(`📅 今日声波推荐 (${dateStr})`, `
        <div style="background:#141312;color:#fef08a;padding:8px 10px;margin-bottom:10px;font-weight:900;">
          🎯 今日日历主题：${festTitle}（每日零点自动轮换，最多推荐3首）
        </div>
        ${picks.map((b, i) => `
          <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:8px;box-shadow:3px 3px 0 #141312;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="badge punk">今日推荐 #0${i + 1}</span>
              <span style="font-size:11px;font-weight:900;">${b.prov} · ${b.cityName} (${b.year})</span>
            </div>
            <h4 style="font-size:15px;font-weight:900;margin-top:4px;">${b.name} — ${b.works.split("》")[0]}》</h4>
            <p style="font-size:11px;opacity:0.82;margin:4px 0 8px;">${b.desc}</p>
            <button class="zine-btn dark" style="height:26px;" onclick="closeModal();openCityDrawer('${b.cityId}','${b.id}')">📍 飞往该城查看乐队</button>
          </div>
        `).join("")}
      `);
    });

    // 3) 历史地标图层开关与详情
    document.getElementById("btn-toggle-landmarks").addEventListener("click", function() {
      appState.showLandmarks = !appState.showLandmarks;

    function submitBandPost(bandId) {
      const txt = document.getElementById("post-text").value.trim();
      const photographer = document.getElementById("img-photographer").value.trim() || appState.handle;
      const year = document.getElementById("img-year").value.trim() || "2026";
      const source = document.getElementById("img-source").value;
      const license = document.getElementById("img-license").value;
      const fileInput = document.getElementById("post-file");

      if (!txt && (!fileInput.files || !fileInput.files[0])) {
        showToast("请填写留言或选择一张图片");
        return;
      }
      const finishSave = (base64Img) => {
        if (!appState.posts[bandId]) appState.posts[bandId] = [];
        appState.posts[bandId].unshift({
          id: "P" + Date.now(),
          author: appState.handle,
          text: txt || "上传了现场影像文献",
          img: base64Img,
          imgMeta: { photographer, year, source, license },
          time: "2026-10-25",
          reported: false,
          hidden: false
        });
        addPoints(15, "上传合规影像/留言");
        openBandPostsModal(bandId);
        if (currentCityId) refreshDrawerBands(null);
      };
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 520;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            finishSave(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSave(null);
      }
    }

    document.getElementById("btn-open-mod").addEventListener("click", renderModQueueModal);

    function renderModQueueModal() {
      const list = appState.modQueue || [];
      openModal("🛡️ 社区审核队列（先发后审 + 举报下架 + 官方认领）", `
        <p style="margin-bottom:8px;font-weight:700;">支持对乐队官方认领、新增词条以及侵权举报进行一键审批或下架：</p>
        ${list.length === 0 ? `<p>当前无待处理工单。</p>` : list.map(m => `
          <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="badge ${m.type === 'REPORT_POST' ? 'punk' : 'indie'}">${m.type === 'REPORT_POST' ? '⚠️ 举报下架工单' : '🎸 乐队官方认领'}</span>
              <span style="font-weight:900;color:${m.status === 'PENDING' ? 'var(--amber)' : 'var(--green)'};">${m.status}</span>
            </div>
            <div style="font-weight:900;margin-top:4px;">关联乐队：${m.bandName} | 提交人：${m.applicant}</div>
            <p style="font-size:11px;margin:4px 0;">详情：${m.note}</p>
            ${m.status === "PENDING" ? `
              <div style="display:flex;gap:6px;margin-top:6px;">
                <button class="zine-btn dark" style="height:26px;" onclick="resolveModItem('${m.id}', 'APPROVED')">✓ 批准通过 / 执行下架</button>
                <button class="zine-btn" style="height:26px;" onclick="resolveModItem('${m.id}', 'REJECTED')">✕ 驳回工单</button>
              </div>
            ` : ""}
          </div>
        `).join("")}
      `);
    }

    function resolveModItem(modId, decision) {
      const m = appState.modQueue.find(x => x.id === modId);
      if (!m) return;
      m.status = decision;
      if (decision === "APPROVED") {
        if (m.type === "CLAIM") {
          const b = BANDS_DB.find(x => x.id === m.bandId);
          if (b) {
            b.claimed = true;
            b.history.unshift({ user: m.applicant, time: "2026-10-25", note: "通过官方乐队/厂牌认领认证" });
          }
        } else if (m.type === "REPORT_POST") {
          const postArr = appState.posts[m.bandId] || [];
          const targetP = postArr.find(x => x.id === m.postId);
          if (targetP) targetP.hidden = true;
        }
        addPoints(15, "参与社区审核治理");
      }
      saveState();
      renderModQueueModal();
      if (currentCityId) refreshDrawerBands(null);
    }

    // 10) 贡献者个人主页与荣誉徽章
    document.getElementById("btn-open-profile").addEventListener("click", () => {
      const pts = appState.points || 120;
      const badges = [
        { name: "📻 地下听众", req: 50, desc: "进入中国摇滚声音地图" },
        { name: "🗂️ 地下档案员", req: 120, desc: "参与补录或收藏地下乐队" },
        { name: "🔍 现场勘误官", req: 150, desc: "参与词条修订与版本维护" },
        { name: "🧭 城市声学向导", req: 200, desc: "完成摇滚地标或路线朝圣打卡" },
        { name: "🎸 树村守夜人", req: 300, desc: "深度共创贡献者最高荣誉勋章" }
      ];
      openModal("🏅 贡献者个人主页 & 荣誉徽章馆", `
        <div style="border:2px solid #141312;background:#fff;padding:10px;margin-bottom:10px;">
          <label style="font-weight:900;">你的地下花名代号：</label>
          <div style="display:flex;gap:6px;margin-top:4px;">
            <input id="prof-handle" class="form-input" style="margin:0;" value="${appState.handle}" />
            <button class="zine-btn dark" onclick="appState.handle=document.getElementById('prof-handle').value.trim()||appState.handle;saveState();showToast('花名已更新')">保存</button>
          </div>
          <div style="margin-top:8px;font-weight:900;font-size:14px;">
            当前声望积分：<span style="color:var(--crimson);">${pts} 分</span> | 已打卡站点：${appState.checkins.length} 处
          </div>
        </div>
        <h4 style="font-weight:900;margin-bottom:6px;">🎖️ 丝网印刷荣誉勋章墙：</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${badges.map(bg => {
            const unlocked = pts >= bg.req;
            return `
              <div style="border:2px solid #141312;padding:8px;background:${unlocked ? '#fef08a' : '#e5e5e5'};opacity:${unlocked ? 1 : 0.6};">
                <div style="font-weight:900;font-size:13px;">${bg.name} ${unlocked ? "✓" : `(需${bg.req}分)`}</div>
                <div style="font-size:10px;margin-top:2px;">${bg.desc}</div>
              </div>
            `;
          }).join("")}
        </div>
      `);
    });

    // 11) 盖章补录新乐队
    document.getElementById("btn-open-add").addEventListener("click", () => openAddBandModal(currentCityId || "beijing"));

    function openAddBandModal(defaultCityId = "beijing") {
      openModal("＋ 盖章补录新乐队档案", `
        <label style="font-weight:900;">所属城市：</label>
        <select id="add-city" class="form-select">
          ${Object.values(CITY_MAP).map(c => `<option value="${c.id}" ${c.id === defaultCityId ? "selected" : ""}>[${c.prov}] ${c.name}</option>`).join("")}
        </select>
        <label style="font-weight:900;">乐队名称*：</label>
        <input id="add-name" class="form-input" placeholder="输入乐队或音乐人名称..." />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <label style="font-weight:900;">成立年份：</label>
            <input id="add-year" class="form-input" value="2020" />
          </div>
          <div>
            <label style="font-weight:900;">风格流派：</label>
            <input id="add-genre" class="form-input" value="后朋克 / 独立摇滚" />
          </div>
        </div>
        <label style="font-weight:900;">代表作品：</label>
        <input id="add-works" class="form-input" placeholder="如：《立秋》《同名专辑》" />
        <label style="font-weight:900;">乐队简介与现场记录：</label>
        <textarea id="add-desc" class="form-textarea" rows="3"></textarea>
        <button class="zine-btn red" style="width:100%;justify-content:center;" onclick="confirmAddBand()">🔨 盖下红印收录入库 (+25分)</button>
      `);
    }

    function confirmAddBand() {
      const cid = document.getElementById("add-city").value;
      const name = document.getElementById("add-name").value.trim();
      if (!name) { showToast("请输入乐队名称"); return; }
      const cObj = CITY_MAP[cid];
      const newBand = {
        id: "B_USR_" + Date.now(),
        name,
        cityId: cid,
        cityName: cObj.name,
        prov: cObj.prov,
        year: document.getElementById("add-year").value.trim() || "2020",
        genre: document.getElementById("add-genre").value.trim() || "独立摇滚",
        works: document.getElementById("add-works").value.trim() || `《${name}》`,
        desc: document.getElementById("add-desc").value.trim() || `${cObj.prov}${cObj.name}独立摇滚乐队，由社区乐迷共创收录。`,
        claimed: false,
        history: [{ user: appState.handle, time: "2026-10-25", note: "社区乐迷首次补录建档" }]
      };
      BANDS_DB.unshift(newBand);
      cObj.bands.unshift(newBand);
      appState.customBands.push(newBand);
      addPoints(25, `成功补录【${name}】`);
      renderEChartsMap();
      closeModal();
      openCityDrawer(cid, newBand.id);
    }

    /********************************************************************
     * 8. 启动入口
     ********************************************************************/
    updateHeaderCounters();
    renderEChartsMap();
  </script>
</body>
</html>
